<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Feature 依赖树可视化</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: #e5e7eb;
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #111827;
        }

        input[type="file"] {
            font-size: 12px;
        }

        main {
            flex: 1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #111827, #020617);
        }

        .link {
            fill: none;
            stroke: #4b5563;
            stroke-width: 1px;
            stroke-opacity: 0.6;
        }

        .node circle {
            cursor: pointer;
            stroke-width: 1px;
        }

        .node text {
            font-size: 12px;
            fill: #e5e7eb;
            paint-order: stroke;
            stroke: #020617;
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        .node--aggregate circle {
            fill: #0ea5e9;
            stroke: #38bdf8;
        }

        .node--scatter circle {
            fill: #22c55e;
            stroke: #4ade80;
        }

        .node--missing circle {
            fill: #f97316;
            stroke: #fed7aa;
            stroke-dasharray: 2 2;
        }

        .node--cycle circle {
            fill: #ef4444;
            stroke: #fecaca;
        }

        .node--collapsed circle {
            stroke-width: 2px;
        }

        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11px;
            color: #e5e7eb;
            max-width: 960px; /* 原来约 480，这里放大为两倍宽度 */
            z-index: 10;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            white-space: normal;
        }

        /* JSON 预览模态框 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
        }

        .modal {
            background: #020617;
            border: 1px solid #1f2937;
            border-radius: 10px;
            /* 自适应宽度：不固定 width，只限制 min/max，让内容决定实际宽度 */
            min-width: 480px;
            max-width: 96vw;    /* 在大屏上尽量宽，但仍留少量边距 */
            max-height: 90vh;
            padding: 10px 12px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }

        .modal-header-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal-title {
            font-weight: 600;
            font-size: 12px;
        }

        .modal-sub {
            font-size: 11px;
            color: #9ca3af;
        }

        .modal-close {
            cursor: pointer;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 16px;
            padding: 0 4px;
        }

        .modal-close:hover {
            color: #e5e7eb;
        }

        .modal-body {
            font-size: 11px;
            color: #e5e7eb;
            overflow: auto;
            border-radius: 6px;
            background: #020617;
            border: 1px solid #111827;
            padding: 6px 8px;
        }

        .modal-editor-layout {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 8px;
            height: 100%;
        }

        .modal-editor {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .modal-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #9ca3af;
        }

        .modal-error {
            color: #fca5a5;
            font-size: 10px;
        }

        .modal-mode-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toggle-active {
            background: #111827;
            border-color: #e5e7eb;
        }

        .modal-form-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 6px;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .modal-form-label {
            color: #9ca3af;
            word-break: break-all;
        }

        .modal-form-input {
            width: 100%;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            padding: 4px 6px;
            font-size: 11px;
        }

        .modal-form-input[type="number"] {
            padding-right: 0;
        }

        #jsonModalTextarea {
            flex: 1;
            width: 100%;
            /* 将 JSON 文本编辑区域高度放大到原来的两倍 */
            min-height: 520px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
            line-height: 1.4;
            background: #020617;
            color: #e5e7eb;
            border-radius: 4px;
            border: 1px solid #1f2937;
            padding: 6px 8px;
            box-sizing: border-box;
        }

        #templateJsonTextarea {
            flex: 1;
            width: 100%;
            min-height: 260px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
            line-height: 1.4;
            background: #020617;
            color: #e5e7eb;
            border-radius: 4px;
            border: 1px solid #1f2937;
            padding: 6px 8px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        /* Molang 模板侧栏样式 */
        .molang-sidebar {
            flex: 0 0 260px;
            max-width: 260px;
            border-left: 1px solid #111827;
            padding-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
        }

        .molang-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .molang-sidebar-title {
            font-weight: 600;
            font-size: 11px;
            color: #e5e7eb;
        }

        .molang-search-input {
            font-size: 11px;
        }

        .molang-template-list {
            flex: 1 1 auto;
            min-height: 80px;
            max-height: 260px;
            overflow: auto;
            border-radius: 4px;
            border: 1px solid #111827;
            padding: 4px;
            background: #020617;
        }

        .molang-template-item {
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid transparent;
            margin-bottom: 3px;
            cursor: pointer;
            background: #020617;
        }

        .molang-template-item:hover {
            border-color: #374151;
            background: #030712;
        }

        .molang-template-item.molang-template-item-active {
            border-color: #22c55e;
            background: #022c22;
        }

        .molang-template-item-name {
            font-size: 11px;
            font-weight: 500;
            color: #e5e7eb;
        }

        .molang-template-item-meta {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 1px;
        }

        .molang-template-item-code {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 2px;
            word-break: break-all;
            white-space: pre-line;
        }

        .molang-template-editor {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid #111827;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .molang-template-editor-title {
            font-size: 10px;
            color: #9ca3af;
        }

        .molang-template-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
            resize: vertical;
        }

        .molang-template-footer {
            justify-content: flex-end;
            margin-top: 2px;
        }

        .molang-sidebar-hint {
            margin-top: 2px;
            font-size: 10px;
            color: #6b7280;
        }

        .molang-sidebar-collapsed {
            display: none;
        }

        @media (max-width: 960px) {
            .modal-editor-layout {
                flex-direction: column;
            }

            .molang-sidebar {
                max-width: none;
                border-left: none;
                border-top: 1px solid #111827;
                padding-left: 0;
                padding-top: 4px;
            }
        }

        .legend {
            position: absolute;
            left: 16px;
            bottom: 16px;
            background: rgba(15, 23, 42, 0.96);
            border-radius: 8px;
            border: 1px solid #1f2937;
            padding: 8px 10px;
            font-size: 11px;
            color: #d1d5db;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
        }

        #status {
            font-size: 11px;
            color: #9ca3af;
            margin-left: 8px;
        }

        /* 拖拽相关样式 */
        .node--dragging {
            opacity: 0.3;
        }
        
        .ghost-node {
            pointer-events: none;
        }
        .ghost-node circle {
            fill: #fff;
            fill-opacity: 0.2;
            stroke: #e5e7eb;
            stroke-width: 2px;
            stroke-dasharray: 4 2;
        }
        .ghost-node text {
            font-size: 10px;
            fill: #e5e7eb;
            opacity: 0.8;
        }

        /* 拖拽目标高亮 */
        /* 1. 成为子节点 (Reparent) - 黄色实线 */
        .node--target-reparent circle {
            stroke: #f59e0b !important;
            stroke-width: 3px !important;
            fill: #451a03 !important;
        }
        
        /* 2. 插入到上方 (Insert Before) - 紫色虚线 */
        .node--target-before circle {
            stroke: #8b5cf6 !important;
            stroke-width: 3px !important;
            stroke-dasharray: 3 2;
        }
        
        /* 3. 插入到下方 (Insert After) - 粉色虚线 */
        .node--target-after circle {
            stroke: #ec4899 !important;
            stroke-width: 3px !important;
            stroke-dasharray: 3 2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<header>
    <h1>Feature 树图浏览器</h1>
    <div id="controls">
        <input id="searchNodeInput" type="text" placeholder="搜索 identifier..." class="modal-form-input" style="width: 120px;" />
        <button class="btn" id="searchNodeBtn">搜索</button>
        <button class="btn" id="openRootBtn">选择</button>
        <button class="btn" id="saveRootBtn">保存</button>
        <input id="fileInput" type="file" accept=".json" style="display:none" />
        <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)" disabled>↶</button>
        <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)" disabled>↷</button>
        <button class="btn" id="newRootBtn">新建</button>
        <button class="btn" id="exportTreeBtn">另存</button>
        <button class="btn" id="exportFeaturesBtn">导出</button>
        <button class="btn" id="manageTemplatesBtn">管理模板</button>
        <button class="btn" id="exportEntryBtn">导出规则</button>
        <!-- 路径管理区域 -->
        <div style="display:flex; gap:4px; align-items:center; border-left:1px solid #374151; padding-left:6px; margin-left:6px;">
             <select id="workDirSelect" class="modal-form-input" style="width:100px; height:26px; padding:2px;" title="选择默认工作路径"></select>
             <button class="btn" id="addWorkDirBtn" title="添加新路径">+</button>
             <button class="btn" id="removeWorkDirBtn" title="移除当前选中的路径">-</button>
        </div>
        <span id="status">未加载文件</span>
    </div>
</header>
<main>
    <svg id="treeSvg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="modal-backdrop" id="jsonModalBackdrop">
        <div class="modal" id="jsonModal">
            <div class="modal-header">
                <div class="modal-header-main">
                    <div class="modal-title" id="jsonModalTitle"></div>
                    <div class="modal-sub" id="jsonModalMeta"></div>
                </div>
                <button class="modal-close" id="jsonModalClose" title="关闭 (Esc)">
                    ×
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-editor-layout">
                    <div class="modal-editor">
                        <div class="modal-editor-header">
                            <span id="jsonModalModeText">字段表单编辑（顶层简单属性）</span>
                            <div class="modal-mode-buttons">
                                <button class="btn btn-toggle-active" id="switchFormModeBtn" type="button">表单模式</button>
                                <button class="btn" id="switchJsonModeBtn" type="button">JSON 模式</button>
                            </div>
                            <span class="modal-error" id="jsonModalError"></span>
                        </div>
                        <div id="jsonModalFormContainer"></div>
                        <textarea id="jsonModalTextarea" spellcheck="false"></textarea>
                    </div>
                    <aside class="molang-sidebar" id="molangSidebar">
                        <div class="molang-sidebar-header">
                            <span class="molang-sidebar-title">Molang 模板</span>
                        </div>
                        <input
                            class="modal-form-input molang-search-input"
                            id="molangSearchInput"
                            type="text"
                            placeholder="搜索模板名称或内容..."
                        />
                        <div class="molang-template-list" id="molangTemplateList"></div>
                        <div class="molang-template-editor">
                            <div class="molang-template-editor-title">模板编辑（保存在本机浏览器）</div>
                            <input
                                class="modal-form-input"
                                id="molangTemplateNameInput"
                                type="text"
                                placeholder="模板名称"
                            />
                            <textarea
                                class="modal-form-input molang-template-code"
                                id="molangTemplateCodeTextarea"
                                rows="4"
                                spellcheck="false"
                                placeholder="在此编写或粘贴 Molang 表达式"
                            ></textarea>
                            <div class="modal-footer molang-template-footer">
                                <button class="btn" id="molangTemplateAddBtn" type="button">新增</button>
                                <button class="btn" id="molangTemplateDeleteBtn" type="button">删除</button>
                                <button class="btn" id="molangTemplateSaveBtn" type="button">保存</button>
                                <button class="btn" id="molangTemplateCopyToEditorBtn" type="button">复制</button>
                            </div>
                        </div>
                        <div class="molang-sidebar-hint">
                            提示：单击列表中的模板可以在下方编辑，双击可直接复制到剪贴板。
                        </div>
                    </aside>
                </div>
                <div class="modal-footer">
                    <button class="btn" id="jsonModalDelete">删除</button>
                    <button class="btn" id="jsonModalCancel">取消</button>
                    <button class="btn" id="jsonModalApply">确定</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-backdrop" id="templateModalBackdrop">
        <div class="modal" id="templateModal">
            <div class="modal-header">
                <div class="modal-header-main">
                    <div class="modal-title">模板管理</div>
                    <div class="modal-sub" id="templateModalMeta">在此修改或删除已保存的模板（仅影响本机浏览器本地存储）</div>
                </div>
                <button class="modal-close" id="templateModalClose" title="关闭">
                    ×
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-editor">
                    <div class="modal-editor-header">
                        <div class="modal-form-row" style="margin-bottom:0">
                            <div class="modal-form-label">模板类型</div>
                            <select class="modal-form-input" id="templateTypeSelect"></select>
                        </div>
                        <div class="modal-form-row" style="margin-bottom:0">
                            <div class="modal-form-label">模板列表</div>
                            <select class="modal-form-input" id="templateListSelect"></select>
                        </div>
                    </div>
                    <div class="modal-form-row">
                        <div class="modal-form-label">模板名称</div>
                        <input class="modal-form-input" id="templateNameInput" type="text" />
                    </div>
                    <div class="modal-form-row" style="grid-template-columns:1fr">
                        <textarea id="templateJsonTextarea" spellcheck="false"></textarea>
                    </div>
                    <span class="modal-error" id="templateModalError"></span>
                    <div class="modal-footer">
                        <button class="btn" id="templateModalAdd">新增模板</button>
                        <button class="btn" id="templateModalDelete">删除模板</button>
                        <button class="btn" id="templateModalCancel">关闭</button>
                        <button class="btn" id="templateModalSave">保存修改</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="legend">
        <div class="legend-row">
            <div class="legend-dot" style="background:#0ea5e9;border:1px solid #38bdf8;"></div>
            <span>aggregate_feature</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#22c55e;border:1px solid #4ade80;"></div>
            <span>scatter_feature</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#f97316;border:1px solid #fed7aa;"></div>
            <span>缺失定义（missing）</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#ef4444;border:1px solid #fecaca;"></div>
            <span>循环引用入口（cycle）</span>
        </div>
    </div>
</main>

<script>
    const svg = d3.select("#treeSvg");
    const statusEl = document.getElementById("status");
    const tooltip = document.getElementById("tooltip");
    const searchNodeInput = document.getElementById("searchNodeInput");
    const searchNodeBtn = document.getElementById("searchNodeBtn");
    const fileInput = document.getElementById("fileInput");
    const openRootBtn = document.getElementById("openRootBtn");
    const newRootBtn = document.getElementById("newRootBtn");
    const exportTreeBtn = document.getElementById("exportTreeBtn");
    const exportFeaturesBtn = document.getElementById("exportFeaturesBtn");
    const saveRootBtn = document.getElementById("saveRootBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const manageTemplatesBtn = document.getElementById("manageTemplatesBtn");
    const exportEntryBtn = document.getElementById("exportEntryBtn");
    const jsonModalBackdrop = document.getElementById("jsonModalBackdrop");
    const jsonModalTitle = document.getElementById("jsonModalTitle");
    const jsonModalMeta = document.getElementById("jsonModalMeta");
    const jsonModalModeText = document.getElementById("jsonModalModeText");
    const jsonModalFormContainer = document.getElementById("jsonModalFormContainer");
    const jsonModalTextarea = document.getElementById("jsonModalTextarea");
    const jsonModalError = document.getElementById("jsonModalError");
    const jsonModalClose = document.getElementById("jsonModalClose");
    const jsonModalApply = document.getElementById("jsonModalApply");
    const jsonModalCancel = document.getElementById("jsonModalCancel");
    const jsonModalDelete = document.getElementById("jsonModalDelete");
    const switchFormModeBtn = document.getElementById("switchFormModeBtn");
    const switchJsonModeBtn = document.getElementById("switchJsonModeBtn");
    const templateModalBackdrop = document.getElementById("templateModalBackdrop");
    const templateModalClose = document.getElementById("templateModalClose");
    const templateModalError = document.getElementById("templateModalError");
    const templateTypeSelect = document.getElementById("templateTypeSelect");
    const templateListSelect = document.getElementById("templateListSelect");
    const templateNameInput = document.getElementById("templateNameInput");
    const templateJsonTextarea = document.getElementById("templateJsonTextarea");
    const templateModalSave = document.getElementById("templateModalSave");
    const templateModalDelete = document.getElementById("templateModalDelete");
    const templateModalCancel = document.getElementById("templateModalCancel");
    const templateModalAdd = document.getElementById("templateModalAdd");
    const molangSidebar = document.getElementById("molangSidebar");
    const molangSearchInput = document.getElementById("molangSearchInput");
    const molangTemplateList = document.getElementById("molangTemplateList");
    const molangTemplateNameInput = document.getElementById("molangTemplateNameInput");
    const molangTemplateCodeTextarea = document.getElementById("molangTemplateCodeTextarea");
    const molangTemplateSaveBtn = document.getElementById("molangTemplateSaveBtn");
    const molangTemplateDeleteBtn = document.getElementById("molangTemplateDeleteBtn");
    const molangTemplateAddBtn = document.getElementById("molangTemplateAddBtn");
    const molangTemplateCopyToEditorBtn = document.getElementById("molangTemplateCopyToEditorBtn");

    let root;      // d3.hierarchy
    let g;         // main group
    let tree;      // layout
    let currentEditNode = null;
    let currentJsonFileName = null;
    // File System Access API 句柄（支持时可直接读写原始 root_feature.json）
    let currentFileHandle = null;
    let currentEditorMode = "form"; // "form" | "json"
    let currentPreviewCopy = null;
    const DEFAULT_FEATURE_FORMAT_VERSION = "1.21.40";
    const TEMPLATE_STORAGE_KEY = "eternal_end_feature_templates_v1";
    let templateStore = {};
    let currentTemplateType = null;
    let currentTemplateIndex = -1;
    const MOLANG_TEMPLATE_STORAGE_KEY = "eternal_end_molang_templates_v1";
    let molangTemplates = [];
    let currentMolangTemplateIndex = -1;
    // 独立跟踪 Shift 是否按下，避免依赖 event.shiftKey 导致后续普通点击被误判为 Shift+点击
    let isShiftPressed = false;

    // ---------- IndexedDB: 默认路径多重存储 ----------
    const DB_CONFIG = { name: "FeatureGraphDB", version: 1, store: "settings" };
    const DB_KEYS = {
        OLD_DEFAULT_HANDLE: "default_dir_handle", // 兼容旧 key
        SAVED_PATHS: "saved_dir_handles_list",    // 存储数组: [{name, handle, id}]
        ACTIVE_PATH_ID: "active_dir_handle_id"    // 存储当前选中的 ID
    };

    function getDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_CONFIG.store)) db.createObjectStore(DB_CONFIG.store);
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e);
        });
    }

    async function getSettingsValue(key) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readonly');
                const req = tx.objectStore(DB_CONFIG.store).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`获取设置 ${key} 失败`, e);
            return undefined;
        }
    }

    async function setSettingsValue(key, value) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readwrite');
                const req = tx.objectStore(DB_CONFIG.store).put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`保存设置 ${key} 失败`, e);
        }
    }

    async function removeSettingsValue(key) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readwrite');
                const req = tx.objectStore(DB_CONFIG.store).delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`删除设置 ${key} 失败`, e);
        }
    }

    // 迁移旧数据
    async function migrateLegacyPaths() {
        const oldHandle = await getSettingsValue(DB_KEYS.OLD_DEFAULT_HANDLE);
        const list = await getSettingsValue(DB_KEYS.SAVED_PATHS);
        if (oldHandle && (!list || !list.length)) {
            // 存在旧的单路径且新列表为空，进行迁移
            const newEntry = {
                id: Date.now().toString(),
                name: oldHandle.name || "Default",
                handle: oldHandle
            };
            await setSettingsValue(DB_KEYS.SAVED_PATHS, [newEntry]);
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, newEntry.id);
            // 删除旧 key
            await removeSettingsValue(DB_KEYS.OLD_DEFAULT_HANDLE);
            console.log("已将旧版默认路径迁移到新列表。");
        }
    }

    // 获取当前活跃的 Handle
    async function getDefaultDirHandle() {
        await migrateLegacyPaths();
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        const activeId = await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        
        if (!list.length) return undefined;
        
        const entry = list.find(item => item.id === activeId);
        if (entry) return entry.handle;
        
        // 如果找不到 activeId 但列表不为空，默认返回第一个，并修正 activeId
        if (list.length > 0) {
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, list[0].id);
            return list[0].handle;
        }
        
        return undefined;
    }

    async function addNewPath(handle) {
        if (!handle) return;
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        
        // 查重：如果 name 和 handle 看起来一样（Handle 比较较难，主要比 name）
        // 简单起见，允许同名，id 区分。
        const newEntry = {
            id: Date.now().toString(),
            name: handle.name,
            handle: handle
        };
        list.push(newEntry);
        
        await setSettingsValue(DB_KEYS.SAVED_PATHS, list);
        await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, newEntry.id);
        return newEntry.id;
    }

    async function removeActivePath() {
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        const activeId = await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        if (!activeId || !list.length) return;

        const idx = list.findIndex(item => item.id === activeId);
        if (idx === -1) return;

        list.splice(idx, 1);
        await setSettingsValue(DB_KEYS.SAVED_PATHS, list);
        
        // 如果还有剩余，选中前一个或第一个
        if (list.length > 0) {
            const newIdx = Math.max(0, idx - 1);
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, list[newIdx].id);
        } else {
            await removeSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        }
    }

    async function switchActivePath(id) {
        await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, id);
    }
    
    async function getAllPaths() {
        await migrateLegacyPaths();
        return (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
    }
    
    async function getActivePathId() {
        return await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
    }

    function copyTextToClipboard(text) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
                () => {
                    statusEl.textContent = "已复制 Molang 模板到剪贴板。";
                },
                () => {
                    statusEl.textContent = "复制到剪贴板失败，请手动复制。";
                }
            );
        } else {
            try {
                const helper = document.createElement("textarea");
                helper.style.position = "fixed";
                helper.style.opacity = "0";
                helper.value = text;
                document.body.appendChild(helper);
                helper.select();
                document.execCommand("copy");
                document.body.removeChild(helper);
                statusEl.textContent = "已复制 Molang 模板到剪贴板。";
            } catch (e) {
                statusEl.textContent = "复制到剪贴板失败，请手动复制。";
            }
        }
    }

    function refreshMolangTemplateList(filterText) {
        if (!molangTemplateList) return;
        molangTemplateList.innerHTML = "";
        const keyword = (filterText || "").trim().toLowerCase();

        const data = Array.isArray(molangTemplates) ? molangTemplates : [];
        data.forEach((tpl, index) => {
            const name = tpl.name || "";
            const category = tpl.category || "";
            const code = tpl.code || "";
            const combined = (name + " " + category + " " + code).toLowerCase();
            if (keyword && !combined.includes(keyword)) return;

            const item = document.createElement("div");
            item.className = "molang-template-item";
            if (index === currentMolangTemplateIndex) {
                item.classList.add("molang-template-item-active");
            }
            item.dataset.index = String(index);

            const title = document.createElement("div");
            title.className = "molang-template-item-name";
            title.textContent = name || "(未命名模板)";
            item.appendChild(title);

            if (category) {
                const meta = document.createElement("div");
                meta.className = "molang-template-item-meta";
                meta.textContent = category;
                item.appendChild(meta);
            }

            if (code) {
                const codeDiv = document.createElement("div");
                codeDiv.className = "molang-template-item-code";
                const preview = code.length > 80 ? code.slice(0, 77) + "..." : code;
                codeDiv.textContent = preview;
                item.appendChild(codeDiv);
            }

            item.addEventListener("click", () => {
                const idx = Number(item.dataset.index);
                if (!Number.isNaN(idx)) {
                    selectMolangTemplate(idx);
                }
            });

            item.addEventListener("dblclick", () => {
                const idx = Number(item.dataset.index);
                if (!Number.isNaN(idx) && molangTemplates[idx] && molangTemplates[idx].code) {
                    copyTextToClipboard(molangTemplates[idx].code);
                }
            });

            molangTemplateList.appendChild(item);
        });

        if (!molangTemplateList.childElementCount) {
            const empty = document.createElement("div");
            empty.style.fontSize = "10px";
            empty.style.color = "#6b7280";
            empty.textContent = keyword ? "没有匹配的 Molang 模板" : "当前还没有 Molang 模板，可以在下方新建。";
            molangTemplateList.appendChild(empty);
        }
    }

    function selectMolangTemplate(index) {
        if (!Array.isArray(molangTemplates) || index < 0 || index >= molangTemplates.length) {
            resetMolangEditor();
            refreshMolangTemplateList(molangSearchInput ? molangSearchInput.value : "");
            return;

        currentMolangTemplateIndex = index;
        const tpl = molangTemplates[index];
        if (molangTemplateNameInput) molangTemplateNameInput.value = tpl.name || "";
        if (molangTemplateCodeTextarea) molangTemplateCodeTextarea.value = tpl.code || "";
        refreshMolangTemplateList(molangSearchInput ? molangSearchInput.value : "");

    function getTemplatesForType(type) {

        return Array.isArray(list) ? list : [];
    }

    function addTemplateForType(type, preview, name, meta) {
        if (!type || !preview || typeof preview !== "object") return;
        if (!templateStore || typeof templateStore !== "object") {
            templateStore = {};
        }
        const list = getTemplatesForType(type).slice();
        const entry = {
            name: name || `模板_${list.length + 1}`,
            type,
            preview: deepClone(preview),
            meta: meta || {},
            createdAt: new Date().toISOString(),
        };
        const existIndex = list.findIndex(t => t.name === entry.name);
        if (existIndex >= 0) {
            list[existIndex] = entry;
        } else {
            list.push(entry);
        }
        templateStore[type] = list;
        saveTemplatesToStorage();
    }

        return Object.keys(templateStore)

    function setByPath(obj, path, value) {
        if (!path) return;
        const parts = path.split(".");
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
            const key = parts[i];
            if (typeof cur[key] !== "object" || cur[key] === null) {
                cur[key] = {};
            }
            cur = cur[key];
        }
        cur[parts[parts.length - 1]] = value;
    }

    function identifierExistsInData(node, identifier) {
        if (!node || typeof node !== "object") return false;
        if (node.identifier === identifier) return true;
        if (Array.isArray(node.children)) {
            for (const child of node.children) {
                if (identifierExistsInData(child, identifier)) return true;
            }
        }
        return false;
    }

    // 根据 preview 内容更新用于展示的 label（名称）
    function updateLabelFromPreview(nodeData) {
        if (!nodeData || !nodeData.preview || typeof nodeData.preview !== "object") return;
        const preview = nodeData.preview;
        const type = nodeData.type || "";
        let label = "";

        // single_block_feature：优先使用 places_block 作为名称
        if (type === "minecraft:single_block_feature" && typeof preview.places_block === "string") {
            label = preview.places_block;
        }
        // structure_template_feature：优先使用 structure_name 作为名称
        else if (type === "minecraft:structure_template_feature" && typeof preview.structure_name === "string") {
            label = preview.structure_name;
        }
        // 其他情况：退回到 description.identifier
        else if (
            preview.description &&
            typeof preview.description === "object" &&
            typeof preview.description.identifier === "string"
        ) {
            label = preview.description.identifier;
        }

        if (label) {
            nodeData.label = label;
        }
    }

    function replaceIdentifierInPreview(obj, oldId, newId) {
        if (!obj || typeof obj !== "object") return;
        if (Array.isArray(obj)) {
            for (let i = 0; i < obj.length; i++) {
                const v = obj[i];
                if (typeof v === "string") {
                    if (v === oldId) obj[i] = newId;
                } else if (typeof v === "object" && v !== null) {
                    replaceIdentifierInPreview(v, oldId, newId);
                }
            }
            return;
        }
        for (const key in obj) {
            if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
            const v = obj[key];
            if (typeof v === "string") {
                if (v === oldId) obj[key] = newId;
            } else if (typeof v === "object" && v !== null) {
                replaceIdentifierInPreview(v, oldId, newId);
            }
        }
    }

    function renameIdentifierEverywhere(oldId, newId) {
        if (!root || !oldId || !newId || oldId === newId) return;
        function walk(node) {
            if (!node || typeof node !== "object") return;
            if (node.identifier === oldId) {
                node.identifier = newId;
            }
            if (node.preview && typeof node.preview === "object") {
                replaceIdentifierInPreview(node.preview, oldId, newId);
            }
            if (Array.isArray(node.children)) {
                node.children.forEach(walk);
            }
        }
        walk(root.data);
    }

    // -------- 通用辅助函数，减少重复代码 --------
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    function deepClone(obj) {
        if (!obj || typeof obj !== "object") return obj;
        if (typeof window.structuredClone === "function") {
            try {
                return window.structuredClone(obj);
            } catch (e) {
                console.warn("structuredClone failed, falling back to JSON", e);
            }
        }
        try {
            return JSON.parse(JSON.stringify(obj));
        } catch (e) {
            // JSON 失败时退回到浅拷贝，至少避免同一引用被直接修改
            return Array.isArray(obj) ? obj.slice() : { ...obj };
        }
    }

    // ---------- 撤销/重做系统 ----------
    const HistoryManager = {
        undoStack: [],
        redoStack: [],
        maxSize: 50,

        // 在执行修改前调用，保存当前状态
        pushState(rootData) {
            if (!rootData) return;
            // 深度克隆当前状态
            const snapshot = deepClone(rootData);
            this.undoStack.push(snapshot);
            if (this.undoStack.length > this.maxSize) {
                this.undoStack.shift();
            }
            // 每次新的操作都会清空重做栈
            this.redoStack = [];
            this.updateUI();
        },

        undo(currentRootData) {
            if (this.undoStack.length === 0) return null;
            // 保存当前状态到 redo 栈
            const currentSnapshot = deepClone(currentRootData);
            this.redoStack.push(currentSnapshot);
            
            const prevState = this.undoStack.pop();
            this.updateUI();
            return prevState;
        },

        redo(currentRootData) {
            if (this.redoStack.length === 0) return null;
            // 保存当前状态到 undo 栈
            const currentSnapshot = deepClone(currentRootData);
            this.undoStack.push(currentSnapshot);

            const nextState = this.redoStack.pop();
            this.updateUI();
            return nextState;
        },

        updateUI() {
            if (undoBtn) undoBtn.disabled = this.undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = this.redoStack.length === 0;
        },
        
        clear() {
            this.undoStack = [];
            this.redoStack = [];
            this.updateUI();
        }
    };

    function generateChildIdentifier(parentId) {
        const baseParentId = parentId || "namespace:feature";
        const baseId = baseParentId.replace(/[^a-zA-Z0-9_:]/g, "_") + "_child_";
        let idx = 1;
        let childId = baseId + idx;
        while (root && identifierExistsInData(root.data, childId)) {
            idx += 1;
            childId = baseId + idx;
        }
        return childId;
    }

    function rebuildHierarchyPreserveExpanded() {
        try {
            const expandedIds = new Set();
            if (root) {
                root.eachBefore(nd => {
                    if (nd.children && nd.children.length && nd.data && nd.data.identifier) {
                        expandedIds.add(nd.data.identifier);
                    }
                });
            }

            root = d3.hierarchy(root.data, d => d.children);
            root.x0 = 0;
            root.y0 = 0;

            root.descendants().forEach(nd => {
                if (nd.children && nd.children.length && nd.data && nd.data.identifier) {
                    if (!expandedIds.has(nd.data.identifier)) {
                        nd._children = nd.children;
                        nd.children = null;
                    }
                }
            });

            update(root);
        } catch (e) {
            console.error("重建层级树失败：", e);
        }
    }

    function searchAndFocusNode(keyword) {
        if (!root || !keyword) return;
        const lowerKw = keyword.toLowerCase();
        let targetNode = null;

        // 广度优先搜索
        root.each(node => {
            if (targetNode) return;
            const id = node.data.identifier || "";
            if (id.toLowerCase().includes(lowerKw)) {
                targetNode = node;
            }
        });

        if (targetNode) {
            // 1. 展开通往该节点的所有父节点
            let parent = targetNode.parent;
            while (parent) {
                if (parent._children) {
                    parent.children = parent._children;
                    parent._children = null;
                }
                parent = parent.parent;
            }
            // 刷新视图以显示展开状态
            update(root);

            // 2. 高亮显示 (临时添加 CSS class 或直接修改样式)
            // 先清除旧的高亮
            g.selectAll("g.node circle")
                .style("stroke", null)
                .style("stroke-width", null)
                .style("fill", null); // 恢复默认填充

            // 找到对应的 DOM 节点并高亮
            // 注意：update(root) 后 DOM 可能已重建，需要重新 select
            // 我们使用绑定的 data 来匹配
            g.selectAll("g.node")
                .filter(d => d === targetNode)
                .select("circle")
                .transition().duration(500)
                .style("stroke", "#ffff00")
                .style("stroke-width", "4px");

            // 3. 移动视图中心到该节点
            const svgNode = svg.node();
            if (svgNode) {
                const width = svgNode.clientWidth || 800;
                const height = svgNode.clientHeight || 600;
                // D3 Tree 布局中，x 是垂直方向，y 是水平方向
                // 我们希望将 targetNode (y, x) 移动到屏幕中心 (width/2, height/2)
                // transform(k, tx, ty) -> [kx + tx, ky + ty]
                // 这里的 zoomIdentity.translate 是 (tx, ty)
                const t = d3.zoomIdentity
                    .translate(width / 2 - targetNode.y, height / 2 - targetNode.x)
                    .scale(1);

                svg.transition().duration(750).call(d3.zoom().on("zoom", (event) => {
                   g.attr("transform", event.transform);
                }).transform, t);
            }

            statusEl.textContent = `已定位到: ${targetNode.data.identifier}`;
        } else {
            statusEl.textContent = `未找到包含 "${keyword}" 的节点`;
        }
    }

    function stepPath(d) {
        // 正交线路径生成器：从 source 到 target
        // M source.y, source.x
        // H (source.y + target.y) / 2  (中间水平线)
        // V target.x                   (垂直线)
        // H target.y                   (目标水平线)
        const sy = d.source.y;
        const sx = d.source.x;
        const ty = d.target.y;
        const tx = d.target.x;
        const halfY = (sy + ty) / 2;
        return `M${sy},${sx}H${halfY}V${tx}H${ty}`;
    }

    function initSvg() {
        svg.selectAll("*").remove();
        const { width, height } = svg.node().getBoundingClientRect();

        const dx = 22;
        const dy = 240;
        tree = d3.tree().nodeSize([dx, dy]);
        // diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x); // 不再使用贝塞尔曲线

        g = svg.append("g")
            .attr("transform", "translate(40,40)");

        const zoom = d3.zoom()
            .scaleExtent([0.2, 2.5])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });

        svg.call(zoom);

        // 初始平移放大一点，避免根节点贴边
        svg.call(
            zoom.transform,
            d3.zoomIdentity.translate(80, height / 2).scale(0.8)
        );
    }

    function buildSafeFeatureFileName(data, index) {
        // 优先使用节点的 identifier（或 preview.description.identifier），并去掉命名空间部分
        let identifier = "";
        if (data && typeof data === "object") {
            if (typeof data.identifier === "string" && data.identifier) {
                identifier = data.identifier;
            } else if (
                data.preview &&
                typeof data.preview === "object" &&
                data.preview.description &&
                typeof data.preview.description === "object" &&
                typeof data.preview.description.identifier === "string" &&
                data.preview.description.identifier
            ) {
                identifier = data.preview.description.identifier;
            }
        }

        let base = "";
        if (identifier) {
            // 去掉命名空间前缀（namespace:xxx -> xxx）
            const withoutNs = identifier.includes(":")
                ? identifier.split(":").pop()
                : identifier;
            // 做一层安全处理，移除不适合作为文件名的字符
            base = withoutNs.replace(/[^a-zA-Z0-9_\-]/g, "_");
        } else {
            // 没有 identifier 时退回到通用占位名
            base = "feature_" + index;
        }

        if (!base.toLowerCase().endsWith(".json")) {
            base += ".json";
        }
        return base;
    }

    // 为 textarea 启用根据内容自动调整高度，并设置一个合理的最小高度
    function enableAutoHeightTextarea(textarea) {
        if (!textarea) return;
        const MIN_HEIGHT_PX = 60; // 初始与最小高度，避免太矮看不清文字
        const resize = () => {
            textarea.style.height = "auto";
            const target = Math.max(textarea.scrollHeight, MIN_HEIGHT_PX);
            textarea.style.height = target + "px";
        };
        textarea.addEventListener("input", resize);
        // 初始执行一次，确保加载时就根据内容调整高度
        resize();
    }

    // 将当前表单中的 input 值应用到目标对象（按 data-path / data-key 写回）
    function applyFormInputsToObject(target) {
        if (!jsonModalFormContainer) return;
        if (!target || typeof target !== "object") return;

        const controls = jsonModalFormContainer.querySelectorAll(
            "input[data-path], input[data-key], textarea[data-path], textarea[data-key]"
        );
        controls.forEach((control) => {
            const path = control.dataset.path || control.dataset.key;
            const type = control.dataset.type;
            let value = control.value;
            if (type === "number") {
                const n = Number(value);
                value = Number.isNaN(n) ? 0 : n;
            } else if (type === "autoNumber") {
                const trimmed = value.trim();
                if (trimmed === "") {
                    value = "";
                } else {
                    const n = Number(trimmed);
                    value = Number.isNaN(n) ? value : n;
                }
            } else if (type === "boolean") {
                value = value === "true";
            }
            if (path) {
                setByPath(target, path, value);
            }
        });
    }

    function buildScatterChildSection(preview, nodeType) {
        if (nodeType !== "minecraft:scatter_feature") return;
        if (!jsonModalFormContainer) return;
        if (!preview || typeof preview !== "object") return;

        const places = preview.places_feature;
        const hasValidPlaces =
            typeof places === "string" &&
            root &&
            identifierExistsInData(root.data, places);

        if (!hasValidPlaces) {
            // -------------------------------------------------------
            // Case 1: places_feature 无效，允许创建新的子节点 (原逻辑)
            // -------------------------------------------------------
            const title = document.createElement("div");
            title.style.fontSize = "10px";
            title.style.color = "#9ca3af";
            title.style.margin = "6px 0 2px 0";
            title.textContent = "scatter_feature：places_feature 无效，可新建子节点";
            jsonModalFormContainer.appendChild(title);

            const row = createChildTypeSelectRow(
                "选中类型即创建子节点",
                "选择要创建的子节点类型…",
                (childType) => {
                    if (!currentEditNode || !root) return;

                    // 记录历史状态
                    if (root && root.data) {
                        HistoryManager.pushState(root.data);
                    }

                    const parentId = currentEditNode.data.identifier || "namespace:feature";
                    const childId = generateChildIdentifier(parentId);

                    const childPreview = createTemplatePreviewForType(childType, childId);
                    const childDataNode = {
                        identifier: childId,
                        type: childType,
                        file: currentEditNode.data.file || "",
                        preview: childPreview,
                    };

                    if (!Array.isArray(currentEditNode.data.children)) {
                        currentEditNode.data.children = [];

                    const parentId = currentEditNode.data.identifier || "namespace:feature";

                    const newChildPreview = createTemplatePreviewForType(childType, newChildId);
                    
                    // 2. 找到旧节点数据并从当前节点移除
                    const oldChildId = places;
                    let oldChildData = null;
                    let oldChildIndex = -1;
                    if (currentEditNode.data.children) {

                    const newChildData = {

                        preview: newChildPreview,

                    if (childType === "minecraft:scatter_feature") {
                        newChildPreview.places_feature = oldChildId;

                        newChildPreview.features = [oldChildId];

                    currentEditNode.data.children.push(newChildData);

                    currentEditNode.data.preview = targetPreview;

                    rebuildHierarchyPreserveExpanded();
                    hideJsonModal();
                },

            jsonModalFormContainer.appendChild(row);

    function buildGenericTopLevelFields(preview) {
        if (!preview || typeof preview !== "object") return;

        const keys = Object.keys(preview);
        if (!keys.length) return;

        // 简单的排序：常用字段靠前
        const priority = ["places_feature", "scatter_chance", "iterations", "features"];
        keys.sort((a, b) => {
            const pa = priority.indexOf(a);
            const pb = priority.indexOf(b);
            if (pa === -1 && pb === -1) return a.localeCompare(b);
            if (pa === -1) return 1;
            if (pb === -1) return -1;
            return pa - pb;
        });

        const title = document.createElement("div");
        title.style.fontSize = "10px";
        title.style.color = "#9ca3af";
        title.style.margin = "6px 0 2px 0";
        title.textContent = "顶层简单字段：";
        jsonModalFormContainer.appendChild(title);

        keys.forEach((key) => {
            if (key === "description" || key === "distribution") {
                return;
            }
            const value = preview[key];
            if (
                typeof value === "string" ||
                typeof value === "number" ||
                typeof value === "boolean"
            ) {
                appendSimpleFieldRow(key, key, value, typeof value);
            }
        });
    }

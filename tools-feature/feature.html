<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Feature 依赖树可视化</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: #e5e7eb;
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #111827;
        }

        input[type="file"] {
            font-size: 12px;
        }

        main {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, #111827, #020617);
        }

        .link {
            fill: none;
            stroke: #4b5563;
            stroke-width: 1px;
            stroke-opacity: 0.6;
        }

        .node circle {
            cursor: pointer;
            stroke-width: 1px;
        }

        .node text {
            font-size: 12px;
            fill: #e5e7eb;
            paint-order: stroke;
            stroke: #020617;
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        .node--aggregate circle {
            fill: #0ea5e9;
            stroke: #38bdf8;
        }

        .node--scatter circle {
            fill: #22c55e;
            stroke: #4ade80;
        }

        .node--missing circle {
            fill: #f97316;
            stroke: #fed7aa;
            stroke-dasharray: 2 2;
        }

        .node--cycle circle {
            fill: #ef4444;
            stroke: #fecaca;
        }

        .node--collapsed circle {
            stroke-width: 2px;
        }

        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #1f2937;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11px;
            color: #e5e7eb;
            max-width: 960px; /* 原来约 480，这里放大为两倍宽度 */
            z-index: 10;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            white-space: normal;
        }

        /* JSON 预览模态框：已改为右侧侧边栏（保留旧样式块为空，避免误引用） */

        .modal {
            background: #020617;
            border: 1px solid #1f2937;
            border-radius: 10px;
            /* 自适应宽度：不固定 width，只限制 min/max，让内容决定实际宽度 */
            min-width: 480px;
            max-width: 96vw;    /* 在大屏上尽量宽，但仍留少量边距 */
            max-height: 90vh;
            padding: 10px 12px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }

        .modal-header-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal-title {
            font-weight: 600;
            font-size: 12px;
        }

        .modal-sub {
            font-size: 11px;
            color: #9ca3af;
        }

        .modal-close {
            cursor: pointer;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 16px;
            padding: 0 4px;
        }

        .modal-close:hover {
            color: #e5e7eb;
        }

        .modal-body {
            font-size: 11px;
            color: #e5e7eb;
            overflow: auto;
            border-radius: 6px;
            background: #020617;
            border: 1px solid #111827;
            padding: 6px 8px;
        }

        .modal-editor-layout {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 8px;
            height: 100%;
        }

        .modal-editor {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .modal-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #9ca3af;
        }

        .modal-error {
            color: #fca5a5;
            font-size: 10px;
        }

        .modal-mode-buttons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toggle-active {
            background: #111827;
            border-color: #e5e7eb;
        }

        .modal-form-row {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 6px;
            align-items: center;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .modal-form-label {
            color: #9ca3af;
            word-break: break-all;
        }

        .modal-form-input {
            width: 100%;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            padding: 4px 6px;
            font-size: 11px;
        }

        .modal-form-input[type="number"] {
            padding-right: 0;
        }

        #jsonModalTextarea {
            flex: 1;
            width: 100%;
            /* 将 JSON 文本编辑区域高度放大到原来的两倍 */
            min-height: 520px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 11px;
            line-height: 1.4;
            background: #020617;
            color: #e5e7eb;
            border-radius: 4px;
            border: 1px solid #1f2937;
            padding: 6px 8px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        /* 右侧侧边栏编辑器（替代 Modal） */
        .sidebar-editor {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: min(840px, 92vw);
            background: rgba(2, 6, 23, 0.98);
            border-left: 1px solid #1f2937;
            box-shadow: -18px 0 50px rgba(0, 0, 0, 0.55);
            z-index: 30;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-editor--open {
            display: flex;
        }

        .sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .sidebar-header-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .sidebar-title {
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-sub {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-close {
            cursor: pointer;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 16px;
            padding: 0 4px;
        }

        .sidebar-close:hover {
            color: #e5e7eb;
        }

        .sidebar-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: auto;
        }

        .sidebar-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #9ca3af;
        }

        /* 侧边栏中 textarea 适当收缩，避免占满屏 */
        #jsonModalTextarea {
            min-height: 360px;
        }

        .sidebar-footer {
            padding: 10px 12px;
            border-top: 1px solid #111827;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .legend {
            position: absolute;
            left: 16px;
            bottom: 16px;
            background: rgba(15, 23, 42, 0.96);
            border-radius: 8px;
            border: 1px solid #1f2937;
            padding: 8px 10px;
            font-size: 11px;
            color: #d1d5db;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
        }

        #status {
            font-size: 11px;
            color: #9ca3af;
            margin-left: 8px;
        }

        /* 拖拽相关样式 */
        .node--dragging {
            opacity: 0.3;
        }
        
        .ghost-node {
            pointer-events: none;
        }
        .ghost-node circle {
            fill: #fff;
            fill-opacity: 0.2;
            stroke: #e5e7eb;
            stroke-width: 2px;
            stroke-dasharray: 4 2;
        }
        .ghost-node text {
            font-size: 10px;
            fill: #e5e7eb;
            opacity: 0.8;
        }

        /* 拖拽目标高亮 */
        /* 1. 成为子节点 (Reparent) - 黄色实线 */
        .node--target-reparent circle {
            stroke: #f59e0b !important;
            stroke-width: 3px !important;
            fill: #451a03 !important;
        }
        
        /* 2. 插入到上方 (Insert Before) - 紫色虚线 */
        .node--target-before circle {
            stroke: #8b5cf6 !important;
            stroke-width: 3px !important;
            stroke-dasharray: 3 2;
        }
        
        /* 3. 插入到下方 (Insert After) - 粉色虚线 */
        .node--target-after circle {
            stroke: #ec4899 !important;
            stroke-width: 3px !important;
            stroke-dasharray: 3 2;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<header>
    <h1>Feature 树图浏览器</h1>
    <div id="controls">
        <button class="btn" id="openRootBtn">选择</button>
        <button class="btn" id="saveRootBtn">保存</button>
        <input id="fileInput" type="file" accept=".json" style="display:none" />
        <button class="btn" id="syncMolangsBtn" title="将 tools-feature/molangs/*.molang 批量同步到对应节点的 distribution.iterations">Sync</button>
        <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)" disabled>↶</button>
        <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)" disabled>↷</button>
        <button class="btn" id="newRootBtn">新建</button>
        <button class="btn" id="exportTreeBtn">另存</button>
        <button class="btn" id="exportFeaturesBtn">导出</button>
        <!-- 路径管理区域 -->
        <div style="display:flex; gap:4px; align-items:center; border-left:1px solid #374151; padding-left:6px; margin-left:6px;">
             <select id="workDirSelect" class="modal-form-input" style="width:100px; height:26px; padding:2px;" title="选择默认工作路径"></select>
             <button class="btn" id="addWorkDirBtn" title="添加新路径">+</button>
             <button class="btn" id="removeWorkDirBtn" title="移除当前选中的路径">-</button>
        </div>
        <span id="status">未加载文件</span>
    </div>
</header>
<main>
    <svg id="treeSvg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <!-- 右侧侧边栏编辑器（替代 Modal） -->
    <aside class="sidebar-editor" id="jsonSidebarEditor" aria-label="节点编辑器">
        <div class="sidebar-header">
            <div class="sidebar-header-main">
                <div class="sidebar-title" id="jsonModalTitle"></div>
                <div class="sidebar-sub" id="jsonModalMeta"></div>
            </div>
            <button class="btn" id="nodeSyncBtn" type="button" title="节点 sync：首次导出到 tools-feature/features；再次点击从文件同步回节点（支持新增子节点）。">sync</button>
            <button class="sidebar-close" id="jsonModalClose" title="关闭 (Esc)">×</button>
        </div>

        <div class="sidebar-body">
            <div class="sidebar-editor-header">
                <span id="jsonModalModeText">字段表单编辑（顶层简单属性）</span>
                <div class="modal-mode-buttons">
                    <button class="btn btn-toggle-active" id="switchFormModeBtn" type="button">表单模式</button>
                    <button class="btn" id="switchJsonModeBtn" type="button">JSON 模式</button>
                </div>
                <span class="modal-error" id="jsonModalError"></span>
            </div>
            <div id="jsonModalFormContainer"></div>
            <textarea id="jsonModalTextarea" spellcheck="false"></textarea>
        </div>

        <div class="sidebar-footer">
            <button class="btn" id="jsonModalDelete">删除</button>
            <button class="btn" id="jsonModalCancel">取消</button>
            <button class="btn" id="jsonModalApply">确定</button>
        </div>
    </aside>
    <div class="legend">
        <div class="legend-row">
            <div class="legend-dot" style="background:#0ea5e9;border:1px solid #38bdf8;"></div>
            <span>aggregate_feature</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#22c55e;border:1px solid #4ade80;"></div>
            <span>scatter_feature</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#f97316;border:1px solid #fed7aa;"></div>
            <span>缺失定义（missing）</span>
        </div>
        <div class="legend-row">
            <div class="legend-dot" style="background:#ef4444;border:1px solid #fecaca;"></div>
            <span>循环引用入口（cycle）</span>
        </div>
    </div>
</main>

<script>
    const svg = d3.select("#treeSvg");
    const statusEl = document.getElementById("status");
    const tooltip = document.getElementById("tooltip");
    const fileInput = document.getElementById("fileInput");
    const openRootBtn = document.getElementById("openRootBtn");
    const newRootBtn = document.getElementById("newRootBtn");
    const exportTreeBtn = document.getElementById("exportTreeBtn");
    const exportFeaturesBtn = document.getElementById("exportFeaturesBtn");
    const saveRootBtn = document.getElementById("saveRootBtn");
    const syncMolangsBtn = document.getElementById("syncMolangsBtn");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const jsonSidebarEditor = document.getElementById("jsonSidebarEditor");
    const jsonModalTitle = document.getElementById("jsonModalTitle");
    const jsonModalMeta = document.getElementById("jsonModalMeta");
    const jsonModalModeText = document.getElementById("jsonModalModeText");
    const jsonModalFormContainer = document.getElementById("jsonModalFormContainer");
    const jsonModalTextarea = document.getElementById("jsonModalTextarea");
    const jsonModalError = document.getElementById("jsonModalError");
    const jsonModalClose = document.getElementById("jsonModalClose");
    const nodeSyncBtn = document.getElementById("nodeSyncBtn");
    const jsonModalApply = document.getElementById("jsonModalApply");
    const jsonModalCancel = document.getElementById("jsonModalCancel");
    const jsonModalDelete = document.getElementById("jsonModalDelete");
    const switchFormModeBtn = document.getElementById("switchFormModeBtn");
    const switchJsonModeBtn = document.getElementById("switchJsonModeBtn");

    let root;      // d3.hierarchy
    let g;         // main group
    let tree;      // layout
    let currentEditNode = null;
    let currentJsonFileName = null;
    // File System Access API 句柄（支持时可直接读写原始 root_feature.json）
    let currentFileHandle = null;
    let currentEditorMode = "form"; // "form" | "json"
    let currentPreviewCopy = null;
    const DEFAULT_FEATURE_FORMAT_VERSION = "1.21.40";
    // 已移除：模板功能 / Molang 模板功能
    // 独立跟踪 Shift 是否按下，避免依赖 event.shiftKey 导致后续普通点击被误判为 Shift+点击
    let isShiftPressed = false;

    // ---------- IndexedDB: 默认路径多重存储 ----------
    const DB_CONFIG = { name: "FeatureGraphDB", version: 1, store: "settings" };
    const DB_KEYS = {
        OLD_DEFAULT_HANDLE: "default_dir_handle", // 兼容旧 key
        SAVED_PATHS: "saved_dir_handles_list",    // 存储数组: [{name, handle, id}]
        ACTIVE_PATH_ID: "active_dir_handle_id"    // 存储当前选中的 ID
    };

    function getDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(DB_CONFIG.store)) db.createObjectStore(DB_CONFIG.store);
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e);
        });
    }

    async function getSettingsValue(key) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readonly');
                const req = tx.objectStore(DB_CONFIG.store).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`获取设置 ${key} 失败`, e);
            return undefined;
        }
    }

    async function setSettingsValue(key, value) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readwrite');
                const req = tx.objectStore(DB_CONFIG.store).put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`保存设置 ${key} 失败`, e);
        }
    }

    async function removeSettingsValue(key) {
        try {
            const db = await getDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_CONFIG.store, 'readwrite');
                const req = tx.objectStore(DB_CONFIG.store).delete(key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        } catch (e) {
            console.warn(`删除设置 ${key} 失败`, e);
        }
    }

    // 迁移旧数据
    async function migrateLegacyPaths() {
        const oldHandle = await getSettingsValue(DB_KEYS.OLD_DEFAULT_HANDLE);
        const list = await getSettingsValue(DB_KEYS.SAVED_PATHS);
        if (oldHandle && (!list || !list.length)) {
            // 存在旧的单路径且新列表为空，进行迁移
            const newEntry = {
                id: Date.now().toString(),
                name: oldHandle.name || "Default",
                handle: oldHandle
            };
            await setSettingsValue(DB_KEYS.SAVED_PATHS, [newEntry]);
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, newEntry.id);
            // 删除旧 key
            await removeSettingsValue(DB_KEYS.OLD_DEFAULT_HANDLE);
            console.log("已将旧版默认路径迁移到新列表。");
        }
    }

    // 获取当前活跃的 Handle
    async function getDefaultDirHandle() {
        await migrateLegacyPaths();
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        const activeId = await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        
        if (!list.length) return undefined;
        
        const entry = list.find(item => item.id === activeId);
        if (entry) return entry.handle;
        
        // 如果找不到 activeId 但列表不为空，默认返回第一个，并修正 activeId
        if (list.length > 0) {
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, list[0].id);
            return list[0].handle;
        }
        
        return undefined;
    }

    async function addNewPath(handle) {
        if (!handle) return;
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        
        // 查重：如果 name 和 handle 看起来一样（Handle 比较较难，主要比 name）
        // 简单起见，允许同名，id 区分。
        const newEntry = {
            id: Date.now().toString(),
            name: handle.name,
            handle: handle
        };
        list.push(newEntry);
        
        await setSettingsValue(DB_KEYS.SAVED_PATHS, list);
        await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, newEntry.id);
        return newEntry.id;
    }

    async function removeActivePath() {
        const list = (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
        const activeId = await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        if (!activeId || !list.length) return;

        const idx = list.findIndex(item => item.id === activeId);
        if (idx === -1) return;

        list.splice(idx, 1);
        await setSettingsValue(DB_KEYS.SAVED_PATHS, list);
        
        // 如果还有剩余，选中前一个或第一个
        if (list.length > 0) {
            const newIdx = Math.max(0, idx - 1);
            await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, list[newIdx].id);
        } else {
            await removeSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
        }
    }

    async function switchActivePath(id) {
        await setSettingsValue(DB_KEYS.ACTIVE_PATH_ID, id);
    }
    
    async function getAllPaths() {
        await migrateLegacyPaths();
        return (await getSettingsValue(DB_KEYS.SAVED_PATHS)) || [];
    }
    
    async function getActivePathId() {
        return await getSettingsValue(DB_KEYS.ACTIVE_PATH_ID);
    }

    // 已移除：模板功能 / Molang 模板功能

    function isNumericKey(k) {
        return typeof k === "string" && /^[0-9]+$/.test(k);
    }

    function setByPath(obj, path, value) {
        if (!path) return;
        const parts = path.split(".");
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
            const key = parts[i];
            const nextKey = parts[i + 1];
            const nextShouldBeArray = isNumericKey(nextKey);

            // 当前 key 是数组下标
            if (isNumericKey(key)) {
                const idx = Number(key);
                if (!Array.isArray(cur)) {
                    // 尽量把当前节点变成数组（如果之前是对象，会被覆盖；但这是表单写入时的预期行为）
                    cur = [];
                }
                if (typeof cur[idx] !== "object" || cur[idx] === null) {
                    cur[idx] = nextShouldBeArray ? [] : {};
                }
                cur = cur[idx];
                continue;
            }

            // 当前 key 是普通对象字段
            if (typeof cur[key] !== "object" || cur[key] === null) {
                cur[key] = nextShouldBeArray ? [] : {};
            } else {
                // 如果已有类型不符合下一段需求，做一次纠正
                if (nextShouldBeArray && !Array.isArray(cur[key])) {
                    cur[key] = [];
                }
                if (!nextShouldBeArray && Array.isArray(cur[key])) {
                    cur[key] = {};
                }
            }
            cur = cur[key];
        }

        const lastKey = parts[parts.length - 1];
        if (isNumericKey(lastKey)) {
            const idx = Number(lastKey);
            if (!Array.isArray(cur)) {
                // 目标应该是数组
                // 这里无法“回写”到父对象，只能就地覆盖为数组并写入
                // 对于本工具的表单写入场景已经足够（extent 通常就是数组）
                cur = [];
            }
            cur[idx] = value;
            return;
        }
        cur[lastKey] = value;
    }

    function identifierExistsInData(node, identifier) {
        if (!node || typeof node !== "object") return false;
        if (node.identifier === identifier) return true;
        if (Array.isArray(node.children)) {
            for (const child of node.children) {
                if (identifierExistsInData(child, identifier)) return true;
            }
        }
        return false;
    }

    function replaceIdentifierInPreview(obj, oldId, newId) {
        if (!obj || typeof obj !== "object") return;
        if (Array.isArray(obj)) {
            for (let i = 0; i < obj.length; i++) {
                const v = obj[i];
                if (typeof v === "string") {
                    if (v === oldId) obj[i] = newId;
                } else if (typeof v === "object" && v !== null) {
                    replaceIdentifierInPreview(v, oldId, newId);
                }
            }
            return;
        }
        for (const key in obj) {
            if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
            const v = obj[key];
            if (typeof v === "string") {
                if (v === oldId) obj[key] = newId;
            } else if (typeof v === "object" && v !== null) {
                replaceIdentifierInPreview(v, oldId, newId);
            }
        }
    }

    function renameIdentifierEverywhere(oldId, newId) {
        if (!root || !oldId || !newId || oldId === newId) return;
        function walk(node) {
            if (!node || typeof node !== "object") return;
            if (node.identifier === oldId) {
                node.identifier = newId;
            }
            if (node.data && typeof node.data === "object") {
                replaceIdentifierInPreview(node.data, oldId, newId);
            }
            if (Array.isArray(node.children)) {
                node.children.forEach(walk);
            }
        }
        walk(root.data);
    }

    // -------- 通用辅助函数，减少重复代码 --------
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    function deepClone(obj) {
        if (!obj || typeof obj !== "object") return obj;
        if (typeof window.structuredClone === "function") {
            try {
                return window.structuredClone(obj);
            } catch (e) {
                console.warn("structuredClone failed, falling back to JSON", e);
            }
        }
        try {
            return JSON.parse(JSON.stringify(obj));
        } catch (e) {
            // JSON 失败时退回到浅拷贝，至少避免同一引用被直接修改
            return Array.isArray(obj) ? obj.slice() : { ...obj };
        }
    }

    // ---------- 撤销/重做系统 ----------
    const HistoryManager = {
        undoStack: [],
        redoStack: [],
        maxSize: 50,

        // 在执行修改前调用，保存当前状态
        pushState(rootData) {
            if (!rootData) return;
            // 深度克隆当前状态
            const snapshot = deepClone(rootData);
            this.undoStack.push(snapshot);
            if (this.undoStack.length > this.maxSize) {
                this.undoStack.shift();
            }
            // 每次新的操作都会清空重做栈
            this.redoStack = [];
            this.updateUI();
        },

        undo(currentRootData) {
            if (this.undoStack.length === 0) return null;
            // 保存当前状态到 redo 栈
            const currentSnapshot = deepClone(currentRootData);
            this.redoStack.push(currentSnapshot);
            
            const prevState = this.undoStack.pop();
            this.updateUI();
            return prevState;
        },

        redo(currentRootData) {
            if (this.redoStack.length === 0) return null;
            // 保存当前状态到 undo 栈
            const currentSnapshot = deepClone(currentRootData);
            this.undoStack.push(currentSnapshot);

            const nextState = this.redoStack.pop();
            this.updateUI();
            return nextState;
        },

        updateUI() {
            if (undoBtn) undoBtn.disabled = this.undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = this.redoStack.length === 0;
        },
        
        clear() {
            this.undoStack = [];
            this.redoStack = [];
            this.updateUI();
        }
    };

    function getChildIdSuffixByType(childType) {
        const t = typeof childType === "string" ? childType : "";
        if (t === "minecraft:aggregate_feature") return "_agg";
        if (t === "minecraft:single_block_feature") return "_block";
        if (t === "minecraft:structure_template_feature") return "_structure";
        if (t === "minecraft:weighted_random_feature") return "_random";
        if (t === "minecraft:scatter_feature") return "_scatter";
        // 默认回退：保持旧语义（child）
        return "_child";
    }

    function generateChildIdentifier(parentId, childType) {
        const baseParentId = parentId || "namespace:feature";
        const suffix = getChildIdSuffixByType(childType);
        const baseId = baseParentId.replace(/[^a-zA-Z0-9_:]/g, "_") + suffix; // 先不带编号

        // 默认不编号：如果不存在重名，直接返回 xxx_agg / xxx_block ...
        if (!root || !identifierExistsInData(root.data, baseId)) {
            return baseId;
        }

        // 发生重名才开始编号：xxx_agg_2, xxx_agg_3 ...
        let idx = 2;
        let childId = `${baseId}_${idx}`;
        while (root && identifierExistsInData(root.data, childId)) {
            idx += 1;
            childId = `${baseId}_${idx}`;
        }
        return childId;
    }

    function rebuildHierarchyPreserveExpanded() {
        try {
            const expandedIds = new Set();
            if (root) {
                root.eachBefore(nd => {
                    if (nd.children && nd.children.length && nd.data && nd.data.identifier) {
                        expandedIds.add(nd.data.identifier);
                    }
                });
            }

            root = d3.hierarchy(root.data, d => d.children);
            root.x0 = 0;
            root.y0 = 0;

            root.descendants().forEach(nd => {
                if (nd.children && nd.children.length && nd.data && nd.data.identifier) {
                    if (!expandedIds.has(nd.data.identifier)) {
                        nd._children = nd.children;
                        nd.children = null;
                    }
                }
            });

            update(root);
        } catch (e) {
            console.error("重建层级树失败：", e);
        }
    }

    function stepPath(d) {
        // 正交线路径生成器：从 source 到 target
        // M source.y, source.x
        // H (source.y + target.y) / 2  (中间水平线)
        // V target.x                   (垂直线)
        // H target.y                   (目标水平线)
        const sy = d.source.y;
        const sx = d.source.x;
        const ty = d.target.y;
        const tx = d.target.x;
        const halfY = (sy + ty) / 2;
        return `M${sy},${sx}H${halfY}V${tx}H${ty}`;
    }

    function initSvg() {
        svg.selectAll("*").remove();

    function buildSafeFeatureFileName(data, index) {
        // 优先使用节点的 identifier（或 preview.description.identifier），并去掉命名空间部分
        let identifier = "";
        if (data && typeof data === "object") {
            if (typeof data.identifier === "string" && data.identifier) {
                identifier = data.identifier;
            } else if (
                data.data &&
                typeof data.data === "object" &&
                data.data.description &&
                typeof data.data.description === "object" &&
                typeof data.data.description.identifier === "string" &&
                data.data.description.identifier
            ) {
                identifier = data.data.description.identifier;
            }
        }

        let base = "";
        if (identifier) {
            // 去掉命名空间前缀（namespace:xxx -> xxx）
            const withoutNs = identifier.includes(":")
                ? identifier.split(":").pop()
                : identifier;
            // 做一层安全处理，移除不适合作为文件名的字符
            base = withoutNs.replace(/[^a-zA-Z0-9_\-]/g, "_");
        } else {
            // 没有 identifier 时退回到通用占位名
            base = "feature_" + index;
        }

        if (!base.toLowerCase().endsWith(".json")) {
            base += ".json";
        }
        return base;
    }

    // ---------- Molang 文件同步（scatter_feature.iterations）----------
    const MOLANG_SYNC_DIR_PARTS = ["tools-feature", "molangs"];

    const MOLANG_AUTO_WRITE_DEBOUNCE_MS = 250;

    const FEATURE_SYNC_DIR_PARTS = ["tools-feature", "features"];

    function encodeIdentifierToFeatureFileName(identifier) {
        // 需求：文件名不需要命名空间
        // 例：ns:foo_bar -> foo_bar.json
        const raw = typeof identifier === "string" ? identifier.trim() : "";
        if (!raw) return "";
        const base = stripNamespaceFromIdentifier(raw);
        if (!base) return "";
        // 文件名只做一层安全化（避免特殊字符）
        const safe = base.replace(/[^a-zA-Z0-9_\-]/g, "_");
        if (!safe) return "";
        return `${safe}${FEATURE_FILE_EXT}`;
    }

    function sanitizeDataNodeForExport(node) {
        // 导出格式：和 root_feature.json 的节点结构一致：
        // { identifier, type, data, children }
        const cloned = deepClone(node);
        if (!cloned || typeof cloned !== "object") return cloned;
        // 去掉工具运行时产生的标记（不属于原始结构）
        delete cloned.missing;
        delete cloned.cycle;
        return cloned;
    }

    function collectIdentifiersInDataTree(rootData) {
        const set = new Set();
        function walk(n) {
            if (!n || typeof n !== "object") return;
            if (typeof n.identifier === "string" && n.identifier) set.add(n.identifier);
            if (Array.isArray(n.children)) n.children.forEach(walk);
        }
        walk(rootData);
        return set;
    }

    function collectIdentifiersInSubtree(dataNode) {
        const set = new Set();
        function walk(n) {
            if (!n || typeof n !== "object") return;
            const id = n.identifier;
            if (typeof id === "string" && id) set.add(id);
            if (Array.isArray(n.children)) n.children.forEach(walk);
        }
        walk(dataNode);
        return set;
    }

    function findDataNodeByIdentifier(rootData, identifier) {
        const target = typeof identifier === "string" ? identifier : "";
        if (!target) return null;
        let found = null;
        function walk(n) {
            if (!n || typeof n !== "object" || found) return;
            if (n.identifier === target) {
                found = n;
                return;
            }
            if (Array.isArray(n.children)) n.children.forEach(walk);
        }
        walk(rootData);
        return found;
    }

    function validateImportedDataNodeShape(obj) {
        if (!obj || typeof obj !== "object") return { ok: false, reason: "文件不是 JSON 对象" };
        const id = obj.identifier;
        const type = obj.type;
        if (typeof id !== "string" || !id.trim()) return { ok: false, reason: "缺少 identifier（必须是非空字符串）" };
        if (typeof type !== "string" || !type.trim()) return { ok: false, reason: "缺少 type（必须是非空字符串）" };
        // data 允许为空对象，但必须是对象（避免写成字符串/数字）
        if (obj.data !== undefined && (obj.data === null || typeof obj.data !== "object" || Array.isArray(obj.data))) {
            return { ok: false, reason: "data 必须是对象（例如 {}）" };
        }
        if (obj.children !== undefined && !Array.isArray(obj.children)) {
            return { ok: false, reason: "children 必须是数组（例如 []）" };
        }
        return { ok: true };
    }

    async function tryWriteNodeToFeatureFileIfExists(identifier, dataNode) {
        try {
            if (!window.showDirectoryPicker) return { ok: false, reason: "no-fs-api" };
            const fileName = encodeIdentifierToFeatureFileName(identifier);
            if (!fileName) return { ok: false, reason: "bad-id" };

            const workDir = await getDefaultDirHandle();
            if (!workDir) return { ok: false, reason: "no-workdir" };
            // 自动回写不主动弹权限窗：仅在已授权时写
            const perm = await hasHandlePermissionNoPrompt(workDir, "readwrite");
            if (!perm) return { ok: false, reason: "no-permission" };

            const featureDir = await getSubDirIfExists(workDir, FEATURE_SYNC_DIR_PARTS);
            if (!featureDir) return { ok: false, reason: "no-feature-dir" };

            let fileHandle;
            try {
                fileHandle = await featureDir.getFileHandle(fileName, { create: false });
            } catch (e) {
                // 文件不存在 => 不自动创建（避免污染目录）
                return { ok: false, reason: "no-file" };
            }

            const exportObj = sanitizeDataNodeForExport(dataNode);
            const jsonStr = JSON.stringify(exportObj, null, 2);
            const writable = await fileHandle.createWritable();
            await writable.write(jsonStr);
            await writable.close();
            return { ok: true, fileName };
        } catch (e) {
            console.warn("自动写回 feature 节点文件失败：", e);
            return { ok: false, reason: "write-failed" };
        }
    }

    function scheduleAutoWriteNodeFeatureFile(identifier, dataNode) {
        const fileName = encodeIdentifierToFeatureFileName(identifier);
        if (!fileName) return;
        const prevTimer = featureAutoWriteTimers.get(fileName);
        if (prevTimer) clearTimeout(prevTimer);
        const t = setTimeout(async () => {
            featureAutoWriteTimers.delete(fileName);
            const r = await tryWriteNodeToFeatureFileIfExists(identifier, dataNode);
            if (r && r.ok) {
                if (statusEl) statusEl.textContent = `已同步节点 -> ${FEATURE_SYNC_DIR_PARTS.join("/")}/${r.fileName}`;
            } else {
                // 避免刷屏：只在真正写失败时提示
                if (r && r.reason === "write-failed") {
                    if (statusEl) statusEl.textContent = "节点已保存，但自动同步到 features 文件失败（请查看控制台）。";
                }
            }
        }, FEATURE_AUTO_WRITE_DEBOUNCE_MS);
        featureAutoWriteTimers.set(fileName, t);
    }

    function findHierarchyNodeByIdentifier(hierarchyRoot, identifier) {
        if (!hierarchyRoot || !identifier) return null;
        let found = null;
        hierarchyRoot.eachBefore(nd => {
            if (found) return;
            if (nd && nd.data && nd.data.identifier === identifier) found = nd;
        });
        return found;
    }

    async function syncAllExistingFeatureFilesFromMemory() {
        try {
            if (!root || !root.data) return;
            if (!window.showDirectoryPicker) return;

            // 这是用户主动点击“保存”触发的同步：允许弹一次权限（若需要）
            const workDir = await ensureWritableWorkDirHandle();
            if (!workDir) return;
            const okPerm = await ensureHandlePermission(workDir, "readwrite");
            if (!okPerm) return;

            // features 目录：不存在则创建（后续可手动 node sync 创建文件）
            const featureDir = await getOrCreateSubDir(workDir, FEATURE_SYNC_DIR_PARTS);

            // 扫描现有文件名，反解出 identifier，然后把内存中的节点写回去
            let scanned = 0;
            let updated = 0;
            let missing = 0;
            let parseFailed = 0;

            for await (const [name, handle] of featureDir.entries()) {
                if (!name || typeof name !== "string") continue;
                if (!name.toLowerCase().endsWith(FEATURE_FILE_EXT)) continue;
                if (!handle || handle.kind !== "file") continue;
                scanned++;

                // 文件名不含命名空间：不能靠文件名唯一定位节点
                // 为保证一致性，这里读取文件内部的 identifier 来定位内存节点
                let fileObj = null;
                try {
                    const file = await handle.getFile();
                    const text = await file.text();
                    fileObj = JSON.parse(text);
                } catch (e) {
                    parseFailed++;
                    continue;
                }

                const id = fileObj && typeof fileObj === "object" ? fileObj.identifier : "";
                if (typeof id !== "string" || !id) {
                    parseFailed++;
                    continue;
                }

                const dataNode = findDataNodeByIdentifier(root.data, id);
                if (!dataNode) {
                    missing++;
                    continue;
                }

                const exportObj = sanitizeDataNodeForExport(dataNode);
                const jsonStr = JSON.stringify(exportObj, null, 2);
                const fileHandle = await featureDir.getFileHandle(name, { create: false });
                const writable = await fileHandle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                updated++;
            }

            if (statusEl) {
                const parts = [];
                parts.push(`features 同步：已扫描 ${scanned} 个文件，回写 ${updated} 个`);
                if (missing) parts.push(`未找到对应节点 ${missing} 个（已跳过）`);
                if (parseFailed) parts.push(`解析失败/缺少 identifier ${parseFailed} 个（已跳过）`);
                statusEl.textContent = parts.join(" | ");
            }
        } catch (e) {
            console.error(e);
            if (statusEl) statusEl.textContent = "features 同步失败：请查看控制台错误信息。";
        }
    }

    async function syncCurrentNodeFeatureFile() {
        try {
            if (!currentEditNode || !root || !root.data) return;
            const currentId = currentEditNode.data && currentEditNode.data.identifier;
            if (!currentId) {
                if (statusEl) statusEl.textContent = "节点 sync 失败：当前节点没有有效的 identifier。";
                return;
            }

            if (!window.showDirectoryPicker) {
                if (statusEl) statusEl.textContent = "节点 sync 失败：当前浏览器不支持目录访问 API。";
                return;
            }

            const workDir = await ensureWritableWorkDirHandle();
            if (!workDir) return;
            const okPerm = await ensureHandlePermission(workDir, "readwrite");
            if (!okPerm) {
                if (statusEl) statusEl.textContent = "节点 sync 失败：没有目录写入权限。";
                return;
            }

            const featureDir = await getOrCreateSubDir(workDir, FEATURE_SYNC_DIR_PARTS);
            const fileName = encodeIdentifierToFeatureFileName(currentId);
            if (!fileName) {
                if (statusEl) statusEl.textContent = "节点 sync 失败：无法生成 feature 文件名。";
                return;
            }

            let existed = true;
            let fileHandle;
            try {
                fileHandle = await featureDir.getFileHandle(fileName, { create: false });
            } catch (e) {
                existed = false;
                fileHandle = await featureDir.getFileHandle(fileName, { create: true });
            }

            if (!existed) {
                // 首次：导出当前节点（含子树）
                const exportObj = sanitizeDataNodeForExport(currentEditNode.data);
                const jsonStr = JSON.stringify(exportObj, null, 2);
                const writable = await fileHandle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                if (statusEl) statusEl.textContent = `已创建：${FEATURE_SYNC_DIR_PARTS.join("/")}/${fileName}（请编辑该文件后再次点 sync 导入）。`;
                return;
            }

            // 已存在：读取文件并同步回节点（支持新增子节点）
            const file = await fileHandle.getFile();
            const text = await file.text();
            let imported;
            try {
                imported = JSON.parse(text);
            } catch (e) {
                if (statusEl) statusEl.textContent = `节点 sync 失败：JSON 语法错误：${e.message}`;
                return;
            }

            const v = validateImportedDataNodeShape(imported);
            if (!v.ok) {
                if (statusEl) statusEl.textContent = `节点 sync 失败：${v.reason}`;
                return;
            }

            // 冲突检测：导入子树的所有 identifier 不得与“当前子树以外”的节点冲突
            const oldSubtreeIds = collectIdentifiersInSubtree(currentEditNode.data);
            const allIds = collectIdentifiersInDataTree(root.data);
            oldSubtreeIds.forEach(id => allIds.delete(id));

            const newSubtreeIds = collectIdentifiersInSubtree(imported);
            if (newSubtreeIds.size === 0) {
                if (statusEl) statusEl.textContent = "节点 sync 失败：导入内容没有任何 identifier。";
                return;
            }
            // 子树内部重复（理论上 Set 已去重，但我们需要检测是否存在空/重复结构；这里检查“遍历数量”更复杂，先做外部冲突即可）
            const conflicts = [];
            newSubtreeIds.forEach(id => {
                if (allIds.has(id)) conflicts.push(id);
            });
            if (conflicts.length) {
                if (statusEl) statusEl.textContent = `节点 sync 失败：identifier 冲突（与树中其他节点重名）：${conflicts.slice(0, 8).join(", ")}${conflicts.length > 8 ? ` ...（共 ${conflicts.length} 个）` : ""}`;
                return;
            }

            // 记录历史（一次）
            HistoryManager.pushState(root.data);

            const oldId = currentEditNode.data.identifier;
            const newId = imported.identifier;

            // 如果根 identifier 被改名：全局重命名（并禁止重名）
            if (oldId && newId && newId !== oldId) {
                if (identifierExistsInData(root.data, newId)) {
                    if (statusEl) statusEl.textContent = `节点 sync 失败：identifier 重名：${newId} 已存在。`;
                    return;
                }
                renameIdentifierEverywhere(oldId, newId);
            }

            // 把导入对象写回当前节点（整棵子树替换）
            // 注意：这里是数据层对象（root.data 里的同一引用），直接覆盖字段即可
            currentEditNode.data.identifier = imported.identifier;
            currentEditNode.data.type = imported.type;
            currentEditNode.data.data = imported.data || {};
            currentEditNode.data.children = Array.isArray(imported.children) ? imported.children : [];

            // 重建树（展示新子节点），并把 currentEditNode 指回新 hierarchy 节点
            const keepId = imported.identifier;
            rebuildHierarchyPreserveExpanded();
            const newHierarchyNode = findHierarchyNodeByIdentifier(root, keepId);
            if (newHierarchyNode) {
                currentEditNode = newHierarchyNode;
            }

            // 刷新右侧编辑器内容（保持打开）
            if (currentEditNode && currentEditNode.data) {
                const nodeType = currentEditNode.data.type;
                const preview = currentEditNode.data.data && typeof currentEditNode.data.data === "object" ? currentEditNode.data.data : {};
                currentPreviewCopy = deepClone(preview);
                if (jsonModalTitle) jsonModalTitle.textContent = currentEditNode.data.identifier || "(无 identifier)";
                if (jsonModalMeta) jsonModalMeta.textContent = `${nodeType || "(无 type)"}`;
                buildFormForPreview(currentPreviewCopy, nodeType);
                if (jsonModalTextarea) {
                    try {
                        jsonModalTextarea.value = JSON.stringify(currentPreviewCopy, null, 2);
                    } catch (e) {
                        jsonModalTextarea.value = String(currentPreviewCopy);
                    }
                }
                setEditorMode("form");
            }

            if (statusEl) statusEl.textContent = `已从 ${FEATURE_SYNC_DIR_PARTS.join("/")}/${fileName} 同步到当前节点（含子树）。`;
        } catch (e) {
            console.error(e);
            if (statusEl) statusEl.textContent = "节点 sync 失败：请查看控制台错误信息。";
        }
    }

    function stripNamespaceFromIdentifier(id) {
        const raw = typeof id === "string" ? id.trim() : "";
        if (!raw) return "";
        if (raw.includes(":")) {
            const parts = raw.split(":").filter(Boolean);
            return parts.length ? parts[parts.length - 1] : raw;
        }
        return raw;
    }

    function normalizeLineEndingsToLF(text) {
        return String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    }

    async function hasHandlePermissionNoPrompt(handle, mode) {
        try {
            if (handle && typeof handle.queryPermission === "function") {
                const q = await handle.queryPermission({ mode });
                return q === "granted";
            }
        } catch (e) {
            console.warn("权限查询失败，将继续尝试操作。", e);
        }
        // 某些环境没有权限 API：只能尝试执行
        return true;
    }

    async function getSubDirIfExists(baseDirHandle, parts) {
        try {
            let cur = baseDirHandle;
            for (const p of parts) {
                cur = await cur.getDirectoryHandle(p, { create: false });
            }
            return cur;
        } catch (e) {
            return null;
        }
    }

    function formatIterationsForMolangFile(iterationsVal) {
        // 保留用户输入的多行/表达式；数字则写成纯数字字符串
        if (iterationsVal === undefined || iterationsVal === null) return "";
        return normalizeLineEndingsToLF(String(iterationsVal));
    }

    // 当 molang 文件已存在（意味着“已通过 sync 机制关联”）时，自动写回 iterations，避免节点与文件不一致
    async function tryWriteIterationsToMolangFileIfExists(fullIdentifier, iterationsVal) {
        try {
            if (!window.showDirectoryPicker) {
                return { ok: false, reason: "no-fs-api" };
            }
            const baseName = stripNamespaceFromIdentifier(fullIdentifier);
            if (!baseName) return { ok: false, reason: "bad-id" };

            const workDir = await getDefaultDirHandle();
            if (!workDir) return { ok: false, reason: "no-workdir" };

            // 自动保存时不主动弹权限窗：仅在已授权时写回
            const perm = await hasHandlePermissionNoPrompt(workDir, "readwrite");
            if (!perm) return { ok: false, reason: "no-permission" };

            const molangDir = await getSubDirIfExists(workDir, MOLANG_SYNC_DIR_PARTS);
            if (!molangDir) return { ok: false, reason: "no-molang-dir" };

            const fileName = `${baseName}${MOLANG_FILE_EXT}`;
            let fileHandle;
            try {
                fileHandle = await molangDir.getFileHandle(fileName, { create: false });
            } catch (e) {
                // 未存在 => 说明尚未通过 sync 关联，不自动创建，避免污染目录
                return { ok: false, reason: "no-file" };
            }

            const content = formatIterationsForMolangFile(iterationsVal);
            const writable = await fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            return { ok: true, fileName };
        } catch (e) {
            console.warn("自动写回 molang 失败：", e);
            return { ok: false, reason: "write-failed" };
        }
    }

    function scheduleAutoWriteIterationsMolang(fullIdentifier, iterationsVal) {
        const baseName = stripNamespaceFromIdentifier(fullIdentifier);
        if (!baseName) return;
        const prevTimer = molangAutoWriteTimers.get(baseName);
        if (prevTimer) clearTimeout(prevTimer);
        const t = setTimeout(async () => {
            molangAutoWriteTimers.delete(baseName);
            const r = await tryWriteIterationsToMolangFileIfExists(fullIdentifier, iterationsVal);
            if (r && r.ok) {
                if (statusEl) statusEl.textContent = `已同步 iterations -> ${MOLANG_SYNC_DIR_PARTS.join("/")}/${r.fileName}`;
            } else {
                // 不刷屏：只在“看起来应该能写但没写成”时提示一句
                // no-file 代表未关联，不提示；no-permission/no-workdir 也不强制提示，避免干扰
                if (r && (r.reason === "write-failed")) {
                    if (statusEl) statusEl.textContent = "iterations 已修改，但自动同步 molang 失败（请查看控制台）。";
                }
            }
        }, MOLANG_AUTO_WRITE_DEBOUNCE_MS);
        molangAutoWriteTimers.set(baseName, t);
    }

    // 移除 Molang 里的 // 行注释与行内注释（尽量不破坏引号内的 //）
    function stripDoubleSlashComments(text) {
        const src = normalizeLineEndingsToLF(text);
        const lines = src.split("\n");
        const out = [];

        for (const line of lines) {
            let inSingle = false;
            let inDouble = false;
            let escape = false;
            let cutAt = -1;

            for (let i = 0; i < line.length; i++) {
                const ch = line[i];

                if (escape) {
                    escape = false;
                    continue;
                }

                if (ch === "\\") {
                    // 仅在引号内才需要处理转义语义；这里统一处理也无妨
                    escape = true;
                    continue;
                }

                if (!inDouble && ch === "'") {
                    inSingle = !inSingle;
                    continue;
                }
                if (!inSingle && ch === '"') {
                    inDouble = !inDouble;
                    continue;
                }

                // 非引号内出现 //：视为注释起点
                if (!inSingle && !inDouble && ch === "/" && i + 1 < line.length && line[i + 1] === "/") {
                    cutAt = i;
                    break;
                }
            }

            const kept = cutAt === -1 ? line : line.slice(0, cutAt);
            // 整行注释会变成空串，直接丢弃；其他行保留原缩进/内容（仅去掉末尾空白）
            const trimmedEnd = kept.replace(/\s+$/g, "");
            if (!trimmedEnd.trim()) {
                // 空行/注释行：忽略
                continue;
            }
            out.push(trimmedEnd);
        }

        return out.join("\n").trim();
    }

    function parseMolangMaybeNumber(text) {
        const s = stripDoubleSlashComments(text);
        if (!s) return "";
        // 纯数字（含小数/科学计数）才转 number，其它都保留为 string（Molang 常包含符号/变量）
        if (/^[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?$/.test(s)) {
            const n = Number(s);
            return Number.isNaN(n) ? s : n;
        }
        return s;
    }

    function buildBaseNameToDataNodesMap(rootData) {
        const map = new Map(); // baseName -> dataNode[]
        function walk(node) {
            if (!node || typeof node !== "object") return;
            const id = node.identifier;
            if (typeof id === "string" && id) {
                const base = stripNamespaceFromIdentifier(id);
                if (base) {
                    const arr = map.get(base) || [];
                    arr.push(node);
                    map.set(base, arr);
                }
            }
            if (Array.isArray(node.children)) {
                node.children.forEach(walk);
            }
        }
        walk(rootData);
        return map;
    }

    function trySetScatterIterationsOnDataNode(dataNode, nextVal) {
        if (!dataNode || typeof dataNode !== "object") return { ok: false, reason: "bad-node" };
        if (dataNode.type !== "minecraft:scatter_feature") return { ok: false, reason: "not-scatter" };
        if (!dataNode.data || typeof dataNode.data !== "object") dataNode.data = {};
        if (!dataNode.data.distribution || typeof dataNode.data.distribution !== "object") {
            dataNode.data.distribution = {};
        }
        const dist = dataNode.data.distribution;
        const prev = dist.iterations;
        if (prev === nextVal) return { ok: false, reason: "no-change" };
        dist.iterations = nextVal;
        return { ok: true };
    }

    // 批量同步 tools-feature/molangs/*.molang -> 对应节点 data.distribution.iterations
    async function syncAllMolangsToNodes() {
        try {
            if (!root || !root.data) {
                if (statusEl) statusEl.textContent = "Sync 失败：当前还没有加载 root_feature.json。";
                return;
            }
            if (!window.showDirectoryPicker) {
                if (statusEl) statusEl.textContent = "Sync 失败：当前浏览器不支持目录访问 API，无法读取本地 .molang 文件。";
                return;
            }

            const workDir = await ensureWritableWorkDirHandle();
            if (!workDir) return;
            const ok = await ensureHandlePermission(workDir, "read");
            if (!ok) {
                if (statusEl) statusEl.textContent = "Sync 失败：没有目录读取权限。";
                return;
            }

            const molangDir = await getOrCreateSubDir(workDir, MOLANG_SYNC_DIR_PARTS);
            const baseMap = buildBaseNameToDataNodesMap(root.data);

            const fileEntries = [];
            for await (const [name, handle] of molangDir.entries()) {
                if (!name || typeof name !== "string") continue;
                if (!name.toLowerCase().endsWith(MOLANG_FILE_EXT)) continue;
                if (!handle || handle.kind !== "file") continue;
                fileEntries.push({ name, handle });
            }

            if (fileEntries.length === 0) {
                if (statusEl) statusEl.textContent = `Sync 完成：未找到 ${MOLANG_SYNC_DIR_PARTS.join("/")}/ 目录下的 *.molang 文件。`;
                return;
            }

            // 先读完并计算“将要修改”的列表，保证只入一次历史栈
            const planned = []; // { base, fileName, nodes[], nextVal }
            // 记录“文件 -> 节点”匹配问题，便于 Sync 后直接定位到具体文件
            const missingFiles = [];        // 未匹配到任何节点的 molang 文件名
            const unmatchedTypeFiles = [];  // 匹配到节点但都不是 scatter_feature 的 molang 文件名

            for (let i = 0; i < fileEntries.length; i++) {
                const { name, handle } = fileEntries[i];
                if (statusEl) statusEl.textContent = `Sync：读取 ${i + 1}/${fileEntries.length} - ${name} ...`;

                const base = name.slice(0, -MOLANG_FILE_EXT.length);
                if (!base) continue;

                const nodes = baseMap.get(base) || [];
                if (!nodes.length) {
                    missingFiles.push(name);
                    continue;
                }

                const file = await handle.getFile();
                const text = normalizeLineEndingsToLF(await file.text());
                const nextVal = parseMolangMaybeNumber(text);

                // 只对 scatter_feature 生效；如果全都不是 scatter，记一下
                const hasScatter = nodes.some(n => n && n.type === "minecraft:scatter_feature");
                if (!hasScatter) {
                    unmatchedTypeFiles.push(name);
                    continue;
                }

                planned.push({ base, fileName: name, nodes, nextVal });
            }

            // 统计实际会变更的节点数
            let willChangeCount = 0;
            for (const item of planned) {
                for (const n of item.nodes) {
                    if (!n || n.type !== "minecraft:scatter_feature") continue;
                    const dist = n.data && n.data.distribution;
                    const prev = dist && typeof dist === "object" ? dist.iterations : undefined;
                    if (prev !== item.nextVal) willChangeCount++;
                }
            }

            function formatFileListForStatus(files, maxShow) {
                const arr = Array.isArray(files) ? files.filter(Boolean) : [];
                if (!arr.length) return "";
                const max = typeof maxShow === "number" && maxShow > 0 ? maxShow : 6;
                if (arr.length <= max) return arr.join(", ");
                return arr.slice(0, max).join(", ") + ` ...（共 ${arr.length} 个）`;
            }

            if (willChangeCount === 0) {
                if (statusEl) {
                    const parts = [];
                    parts.push(`Sync 完成：没有需要更新的节点（已与文件一致）。`);
                    if (missingFiles.length) parts.push(`未匹配到节点：${missingFiles.length} 个（${formatFileListForStatus(missingFiles)}）`);
                    if (unmatchedTypeFiles.length) parts.push(`匹配到但非 scatter_feature：${unmatchedTypeFiles.length} 个（${formatFileListForStatus(unmatchedTypeFiles)}）`);
                    statusEl.textContent = parts.join(" | ");
                }
                // 控制台输出完整列表，避免 status 区域太长被截断
                if (missingFiles.length) console.warn("Sync：未匹配到节点的 molang 文件：", missingFiles);
                if (unmatchedTypeFiles.length) console.warn("Sync：匹配到节点但非 scatter_feature 的 molang 文件：", unmatchedTypeFiles);
                return;
            }

            // 入一次历史栈（撤销一键回退整个批量同步）
            HistoryManager.pushState(root.data);

            let changed = 0;
            let touchedFiles = 0;

            for (const item of planned) {
                let fileChangedAny = false;
                for (const n of item.nodes) {
                    const r = trySetScatterIterationsOnDataNode(n, item.nextVal);
                    if (r.ok) {
                        changed++;
                        fileChangedAny = true;
                    }

                    // 如果当前侧边栏正在编辑这个节点，同步刷新 UI 草稿
                    if (
                        currentEditNode &&
                        currentEditNode.data &&
                        currentEditNode.data.identifier &&
                        stripNamespaceFromIdentifier(currentEditNode.data.identifier) === item.base
                    ) {
                        const nodeType = currentEditNode.data.type;
                        if (currentPreviewCopy && typeof currentPreviewCopy === "object") {
                            if (!currentPreviewCopy.distribution || typeof currentPreviewCopy.distribution !== "object") {
                                currentPreviewCopy.distribution = {};
                            }
                            currentPreviewCopy.distribution.iterations = item.nextVal;
                            refreshFormAndTextareaForCurrentPreview(nodeType);
                        }
                    }
                }
                if (fileChangedAny) touchedFiles++;
            }

            if (statusEl) {
                const parts = [];
                parts.push(`Sync 完成：更新节点 ${changed} 个（来自 ${touchedFiles} 个 molang 文件）`);
                if (missingFiles.length) parts.push(`未匹配到节点：${missingFiles.length} 个（${formatFileListForStatus(missingFiles)}）`);
                if (unmatchedTypeFiles.length) parts.push(`匹配到但非 scatter_feature：${unmatchedTypeFiles.length} 个（${formatFileListForStatus(unmatchedTypeFiles)}）`);
                statusEl.textContent = parts.join(" | ");
            }
            if (missingFiles.length) console.warn("Sync：未匹配到节点的 molang 文件：", missingFiles);
            if (unmatchedTypeFiles.length) console.warn("Sync：匹配到节点但非 scatter_feature 的 molang 文件：", unmatchedTypeFiles);
        } catch (e) {
            console.error(e);
            if (statusEl) statusEl.textContent = "Sync 失败：请查看控制台错误信息。";
        }
    }

    async function ensureHandlePermission(handle, mode) {
        try {
            if (handle && typeof handle.queryPermission === "function") {
                const q = await handle.queryPermission({ mode });
                if (q === "granted") return true;
                if (typeof handle.requestPermission === "function") {
                    const r = await handle.requestPermission({ mode });
                    return r === "granted";
                }
                return false;
            }
        } catch (e) {
            console.warn("权限检查失败，将继续尝试操作。", e);
        }
        // 某些环境没有权限 API，直接继续尝试
        return true;
    }

    async function getOrCreateSubDir(baseDirHandle, parts) {
        let cur = baseDirHandle;
        for (const p of parts) {
            cur = await cur.getDirectoryHandle(p, { create: true });
        }
        return cur;
    }

    async function ensureWritableWorkDirHandle() {
        // 优先用已保存的默认路径；如果没有/无写权限，则引导用户选择一个目录（建议项目根目录）
        if (!window.showDirectoryPicker) {
            if (statusEl) statusEl.textContent = "当前浏览器不支持目录访问 API，无法 sync 到本地 .molang 文件。";
            return null;
        }

        let baseHandle = await getDefaultDirHandle();
        if (baseHandle) {
            const ok = await ensureHandlePermission(baseHandle, "readwrite");
            if (ok) return baseHandle;
        }

        try {
            if (statusEl) statusEl.textContent = "请先选择项目根目录（用于写入 tools-feature/molangs/*.molang）…";
            const picked = await window.showDirectoryPicker({ mode: "readwrite" });
            if (picked) {
                // 记住到路径列表，后续不用重复选
                await addNewPath(picked);
                await refreshWorkDirSelect();
                return picked;
            }
        } catch (e) {
            if (e && e.name === "AbortError") {
                if (statusEl) statusEl.textContent = "已取消选择目录。";
                return null;
            }
            console.error(e);
            if (statusEl) statusEl.textContent = "选择目录失败，请查看控制台。";
            return null;
        }
        return null;
    }

    // 点击 sync：首次创建并写入 iterations；后续读取文件内容并同步回节点
    async function syncScatterIterationsMolangFile() {
        try {
            if (!currentEditNode || !root) return;
            const nodeType = currentEditNode.data && currentEditNode.data.type;
            if (nodeType !== "minecraft:scatter_feature") return;

            const fullId = currentEditNode.data && currentEditNode.data.identifier;
            const baseName = stripNamespaceFromIdentifier(fullId);
            if (!baseName) {
                if (statusEl) statusEl.textContent = "sync 失败：当前 scatter 节点没有有效的 identifier。";
                return;
            }

            const workDir = await ensureWritableWorkDirHandle();
            if (!workDir) return;
            const ok = await ensureHandlePermission(workDir, "readwrite");
            if (!ok) {
                if (statusEl) statusEl.textContent = "sync 失败：没有目录写入权限。";
                return;
            }

            const molangDir = await getOrCreateSubDir(workDir, MOLANG_SYNC_DIR_PARTS);
            const fileName = `${baseName}${MOLANG_FILE_EXT}`;

            // 检查是否已存在
            let existed = true;
            let fileHandle;
            try {
                fileHandle = await molangDir.getFileHandle(fileName, { create: false });
            } catch (e) {
                existed = false;
                fileHandle = await molangDir.getFileHandle(fileName, { create: true });
            }

            if (!existed) {
                // 首次：创建并写入当前 iterations（便于在编辑器里直接改）
                const dist = (currentPreviewCopy && currentPreviewCopy.distribution && typeof currentPreviewCopy.distribution === "object")
                    ? currentPreviewCopy.distribution
                    : null;
                const currentVal = dist ? dist.iterations : "";
                const content = normalizeLineEndingsToLF(currentVal === undefined || currentVal === null ? "" : String(currentVal));

                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();

                if (statusEl) statusEl.textContent = `已创建：${MOLANG_SYNC_DIR_PARTS.join("/")}/${fileName}（已写入当前 iterations），请编辑该文件后再次点 sync 导入。`;
                return;
            }

            // 已存在：读取并同步回 iterations
            const file = await fileHandle.getFile();
            const text = normalizeLineEndingsToLF(await file.text());
            const nextVal = parseMolangMaybeNumber(text);

            // 更新编辑器草稿
            if (!currentPreviewCopy || typeof currentPreviewCopy !== "object") {
                currentPreviewCopy = {};
            }
            if (!currentPreviewCopy.distribution || typeof currentPreviewCopy.distribution !== "object") {
                currentPreviewCopy.distribution = {};
            }
            currentPreviewCopy.distribution.iterations = nextVal;

            // 刷新 UI，让表单/textarea 展示最新值
            refreshFormAndTextareaForCurrentPreview(nodeType);

            // 提交到节点（进入撤销栈）
            applyJsonEdit({ closeOnSuccess: false });
            if (statusEl) statusEl.textContent = `已从 ${MOLANG_SYNC_DIR_PARTS.join("/")}/${fileName} 同步到当前 scatter 节点的 iterations。`;
        } catch (e) {
            console.error(e);
            if (statusEl) statusEl.textContent = "sync 失败：请查看控制台错误信息。";
        }
    }

    function deleteByPath(obj, path) {
        if (!obj || typeof obj !== "object" || !path) return;
        const parts = path.split(".");
        if (!parts.length) return;
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
            const key = parts[i];
            if (cur == null) return;
            if (isNumericKey(key)) {
                const idx = Number(key);
                if (!Array.isArray(cur) || idx < 0 || idx >= cur.length) return;
                cur = cur[idx];
            } else {
                if (typeof cur !== "object") return;
                cur = cur[key];
            }
        }
        const lastKey = parts[parts.length - 1];
        if (isNumericKey(lastKey)) {
            const idx = Number(lastKey);
            if (Array.isArray(cur) && idx >= 0 && idx < cur.length) {
                cur.splice(idx, 1);
            }
            return;
        }
        if (cur && typeof cur === "object") {
            delete cur[lastKey];
        }
    }

    // 将当前表单中的 input 值应用到目标对象（按 data-path / data-key 写回）
    function applyFormInputsToObject(target) {
        if (!jsonModalFormContainer) return;
        if (!target || typeof target !== "object") return;

        const controls = jsonModalFormContainer.querySelectorAll("[data-path], [data-key]");
        controls.forEach((control) => {
            if (control.disabled) return;
            const path = control.dataset.path || control.dataset.key;
            const type = control.dataset.type;

            // checkbox：两类
            // 1) presenceObject: 勾选 => 写入 {}；不勾选 => 删除该字段
            // 2) boolean: 勾选 => true；不勾选 => false
            if (control.tagName === "INPUT" && control.type === "checkbox") {
                const checked = !!control.checked;
                if (type === "presenceObject") {
                    if (checked) setByPath(target, path, {});
                    else deleteByPath(target, path);
                    return;
                }
                if (type === "boolean") {
                    setByPath(target, path, checked);
                    return;
                }
                // 其他 checkbox 默认当 boolean
                setByPath(target, path, checked);
                return;
            }

            let value = control.value;
            if (type === "number") {
                const n = Number(value);
                value = Number.isNaN(n) ? 0 : n;
            } else if (type === "autoNumber") {
                const trimmed = value.trim();
                if (trimmed === "") {
                    value = "";
                } else {
                    const n = Number(trimmed);
                    value = Number.isNaN(n) ? value : n;
                }
            } else if (type === "boolean") {
                value = value === "true";
            } else if (type === "stringArray") {
                // hidden input：存的是 JSON 数组字符串
                try {
                    const parsed = JSON.parse(value || "[]");
                    value = Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    value = [];
                }
            }
            if (path) {
                setByPath(target, path, value);
            }
        });
    }

                        HistoryManager.pushState(root.data);
                    }

                    const parentId = currentEditNode.data.identifier || "namespace:feature";
                    const childId = generateChildIdentifier(parentId, childType);

                    const childPreview = createTemplatePreviewForType(childType, childId);

                    if (!Array.isArray(currentEditNode.data.children)) {

                    }
                    currentEditNode.data.children.push(childDataNode);

                    // 更新当前 scatter_feature 的 places_feature 指向新建子节点
                    const targetPreview = currentPreviewCopy && typeof currentPreviewCopy === "object"
                        ? currentPreviewCopy
                        : (currentEditNode.data.data || {});

                    targetPreview.places_feature = childId;

                    if (currentPreviewCopy && typeof currentPreviewCopy === "object") {
                        currentPreviewCopy = targetPreview;
                    }
                    currentEditNode.data.data = targetPreview;

                    // 重新渲染表单与 JSON 文本
                    refreshFormAndTextareaForCurrentPreview(nodeType);

                    // 重新构建层级树以显示新子节点，同时保留原有展开/折叠状态
                    rebuildHierarchyPreserveExpanded();

                    hideJsonModal();
                }
            );
            jsonModalFormContainer.appendChild(row);

        } else {
            // -------------------------------------------------------
            // Case 2: places_feature 有效，允许插入中间节点 (新逻辑)
            // -------------------------------------------------------
            const title = document.createElement("div");
            title.style.fontSize = "10px";
            title.style.color = "#9ca3af";
            title.style.margin = "6px 0 2px 0";
            title.textContent = `scatter_feature：当前挂载 ${places}，可插入父节点包裹它`;
            jsonModalFormContainer.appendChild(title);

            // 只允许 scatter 和 aggregate
            const INSERT_OPTIONS = [
                ["minecraft:scatter_feature", "scatter_feature (包裹当前节点)"],
                ["minecraft:aggregate_feature", "aggregate_feature (包裹当前节点)"]
            ];

            const row = createChildTypeSelectRow(
                "插入新节点（原节点变为其子节点）",
                "选择要插入的中间节点类型...",
                (childType) => {
                    if (!currentEditNode || !root) return;

                    // 记录历史
                    if (root && root.data) {
                        HistoryManager.pushState(root.data);
                    }

                    // 1. 准备新节点数据
                    const parentId = currentEditNode.data.identifier || "namespace:feature";
                    const newChildId = generateChildIdentifier(parentId + "_wrapper", childType);
                    const newChildPreview = createTemplatePreviewForType(childType, newChildId);
                    
                    // 2. 找到旧节点数据并从当前节点移除
                    const oldChildId = places;
                    let oldChildData = null;
                    let oldChildIndex = -1;
                    if (currentEditNode.data.children) {
                         oldChildIndex = currentEditNode.data.children.findIndex(c => c.identifier === oldChildId);
                         if (oldChildIndex !== -1) {
                             oldChildData = currentEditNode.data.children[oldChildIndex];
                         }
                    }
                    
                    if (!oldChildData) {
                         if (jsonModalError) jsonModalError.textContent = "找不到原子节点数据，无法插入。";
                         return;
                    }

                    // 从当前父节点 children 中移除旧子节点
                    currentEditNode.data.children.splice(oldChildIndex, 1);

                    // 3. 将旧节点加入新节点 children
                    const newChildData = {
                        identifier: newChildId,
                        type: childType,
                        data: newChildPreview,
                        children: [oldChildData] // 移动过去
                    };

                    // 4. 更新新节点的 preview 指向旧节点
                    if (childType === "minecraft:scatter_feature") {
                        newChildPreview.places_feature = oldChildId;
                    } else if (childType === "minecraft:aggregate_feature") {
                        newChildPreview.features = [oldChildId];
                    }

                    // 5. 将新节点加入当前父节点 children
                    currentEditNode.data.children.push(newChildData);

                    // 6. 更新当前父节点的 preview 指向新节点
                    const targetPreview = currentPreviewCopy && typeof currentPreviewCopy === "object"
                        ? currentPreviewCopy
                        : (currentEditNode.data.data || {});

                    targetPreview.places_feature = newChildId;
                    
                    if (currentPreviewCopy && typeof currentPreviewCopy === "object") {
                        currentPreviewCopy = targetPreview;
                    }
                    currentEditNode.data.data = targetPreview;

                    // 刷新
                    refreshFormAndTextareaForCurrentPreview(nodeType);
                    rebuildHierarchyPreserveExpanded();
                    hideJsonModal();
                },
                INSERT_OPTIONS
            );
            jsonModalFormContainer.appendChild(row);
        }
    }

    function buildAggregateChildSection(preview, nodeType) {

                if (!currentEditNode || !root) return;

                if (root && root.data) {
                    HistoryManager.pushState(root.data);
                }

                const parentId = currentEditNode.data.identifier || "namespace:feature";
                const childId = generateChildIdentifier(parentId, childType);

                const childPreview = createTemplatePreviewForType(childType, childId);
                const childDataNode = {

                    type: childType,
                    data: childPreview,
                };

                if (!Array.isArray(currentEditNode.data.children)) {
                    currentEditNode.data.children = [];
                }
                currentEditNode.data.children.push(childDataNode);

                // 同步到当前预览副本和节点 preview 的 features 列表（aggregate 直接存子节点 id）
                const targetPreview = currentPreviewCopy && typeof currentPreviewCopy === "object"
                    ? currentPreviewCopy
                    : (currentEditNode.data.data || {});

                if (!Array.isArray(targetPreview.features)) {
                    targetPreview.features = [];

                targetPreview.features.push(childId);

                if (currentPreviewCopy && typeof currentPreviewCopy === "object") {

                }

                    currentEditNode.data.data = targetPreview;
                }

                // 重新渲染表单与 JSON 文本
                refreshFormAndTextareaForCurrentPreview(nodeType);

                // 重新构建层级树以显示新子节点，同时保留原有展开/折叠状态
                rebuildHierarchyPreserveExpanded();

                // 创建完成后关闭当前编辑窗口，避免误操作
                hideJsonModal();
            }
        );

        jsonModalFormContainer.appendChild(row);

        // ------------------------------
        // 批量添加子节点：只填 ID + 总类型
        // ------------------------------
        const batchTitle = document.createElement("div");
        batchTitle.style.fontSize = "10px";
        batchTitle.style.color = "#9ca3af";
        batchTitle.style.margin = "10px 0 2px 0";
        batchTitle.textContent = "批量添加子节点（只填 ID + 统一类型）：";
        jsonModalFormContainer.appendChild(batchTitle);

        function normalizeChildIdentifier(inputId, parentIdentifier) {
            const raw = (inputId || "").trim();
            if (!raw) return "";
            if (raw.includes(":")) return raw;
            const parent = typeof parentIdentifier === "string" ? parentIdentifier : "";
            if (parent.includes(":")) {
                const ns = parent.split(":")[0];
                if (ns) return `${ns}:${raw}`;
            }
            return raw;
        }

        function parseIdentifiersFromText(text) {
            const src = typeof text === "string" ? text : "";
            // 支持：换行、逗号、分号、空格、Tab 分隔
            const parts = src.split(/[\r\n,; \t]+/g).map(s => s.trim()).filter(Boolean);
            const out = [];
            const seen = new Set();
            for (const p of parts) {
                if (seen.has(p)) continue;
                seen.add(p);
                out.push(p);
            }
            return out;
        }

        // 类型下拉（总类型）
        const batchTypeRow = document.createElement("div");
        batchTypeRow.className = "modal-form-row";
        const batchTypeLabel = document.createElement("div");
        batchTypeLabel.className = "modal-form-label";
        batchTypeLabel.textContent = "统一子节点类型";
        batchTypeRow.appendChild(batchTypeLabel);

        const batchTypeSelect = document.createElement("select");
        batchTypeSelect.className = "modal-form-input";
        const batchTypePlaceholder = document.createElement("option");
        batchTypePlaceholder.value = "";
        batchTypePlaceholder.textContent = "选择类型…";
        batchTypePlaceholder.selected = true;
        batchTypeSelect.appendChild(batchTypePlaceholder);

        const BATCH_CHILD_TYPE_OPTIONS = [
            ["minecraft:single_block_feature", "single_block_feature"],
            ["minecraft:structure_template_feature", "structure_template_feature"],
            ["minecraft:aggregate_feature", "aggregate_feature"],
            ["minecraft:scatter_feature", "scatter_feature"],
            ["minecraft:weighted_random_feature", "weighted_random_feature"],
            ["minecraft:snap_to_surface_feature", "snap_to_surface_feature"],
        ];
        BATCH_CHILD_TYPE_OPTIONS.forEach(([value, text]) => {
            const opt = document.createElement("option");
            opt.value = value;
            opt.textContent = text;
            batchTypeSelect.appendChild(opt);
        });
        batchTypeRow.appendChild(batchTypeSelect);
        jsonModalFormContainer.appendChild(batchTypeRow);

        // ID 输入（多行）
        const batchIdsRow = document.createElement("div");
        batchIdsRow.className = "modal-form-row";
        const batchIdsLabel = document.createElement("div");
        batchIdsLabel.className = "modal-form-label";
        batchIdsLabel.textContent = "子节点 ID（多行/可粘贴）";
        batchIdsRow.appendChild(batchIdsLabel);

        const batchIdsTextarea = document.createElement("textarea");
        batchIdsTextarea.className = "modal-form-input";
        batchIdsTextarea.placeholder = "示例：\nmy_feature_a\nmy_feature_b\nns:my_feature_c\n（支持用换行/逗号/空格分隔）";
        batchIdsRow.appendChild(batchIdsTextarea);
        enableAutoHeightTextarea(batchIdsTextarea);
        jsonModalFormContainer.appendChild(batchIdsRow);

        // 执行按钮
        const batchBtnRow = document.createElement("div");
        batchBtnRow.className = "modal-form-row";
        const batchBtnLabel = document.createElement("div");
        batchBtnLabel.className = "modal-form-label";
        batchBtnLabel.textContent = "操作";
        batchBtnRow.appendChild(batchBtnLabel);

        const batchBtnWrap = document.createElement("div");
        batchBtnWrap.style.display = "flex";
        batchBtnWrap.style.alignItems = "center";
        batchBtnWrap.style.gap = "6px";
        batchBtnWrap.style.minWidth = "0";

        const batchAddBtn = document.createElement("button");
        batchAddBtn.type = "button";
        batchAddBtn.className = "btn";
        batchAddBtn.textContent = "批量创建子节点";
        batchAddBtn.addEventListener("click", () => {
            if (!currentEditNode || !root) return;

            const childType = batchTypeSelect.value;
            if (!childType) {
                if (jsonModalError) jsonModalError.textContent = "请先选择“统一子节点类型”。";
                return;
            }

            const rawIds = parseIdentifiersFromText(batchIdsTextarea.value);
            if (!rawIds.length) {
                if (jsonModalError) jsonModalError.textContent = "请在“子节点 ID”里输入至少 1 个 ID。";
                return;
            }

            const parentId = currentEditNode.data.identifier || "namespace:feature";

            const normalized = rawIds.map(id => normalizeChildIdentifier(id, parentId)).filter(Boolean);
            // 检查批内重复（normalize 后）
            const seen = new Set();
            const dupInBatch = [];
            for (const id of normalized) {
                if (seen.has(id)) dupInBatch.push(id);
                else seen.add(id);
            }
            if (dupInBatch.length) {
                if (jsonModalError) jsonModalError.textContent = `批量输入中存在重复 ID：${Array.from(new Set(dupInBatch)).join(", ")}`;
                return;
            }

            // 检查全局已存在
            const conflicts = normalized.filter(id => identifierExistsInData(root.data, id));
            if (conflicts.length) {
                if (jsonModalError) jsonModalError.textContent = `以下 ID 已存在，无法创建：${conflicts.join(", ")}`;
                return;
            }

            // 记录历史（一次）
            if (root && root.data) {
                HistoryManager.pushState(root.data);
            }

            if (!Array.isArray(currentEditNode.data.children)) {
                currentEditNode.data.children = [];
            }

            const targetPreview = currentPreviewCopy && typeof currentPreviewCopy === "object"
                ? currentPreviewCopy
                : (currentEditNode.data.data || {});

            if (!Array.isArray(targetPreview.features)) {
                targetPreview.features = [];
            }

            // 批量创建
            for (const childId of normalized) {
                const childPreview = createTemplatePreviewForType(childType, childId);
                const childDataNode = {
                    identifier: childId,
                    type: childType,
                    data: childPreview,
                };
                currentEditNode.data.children.push(childDataNode);
                targetPreview.features.push(childId);
            }

            // 同步到当前预览副本与节点 preview
            if (currentPreviewCopy && typeof currentPreviewCopy === "object") {
                currentPreviewCopy = targetPreview;
            }
            if (currentEditNode.data.data && typeof currentEditNode.data.data === "object") {
                currentEditNode.data.data.features = targetPreview.features;
            } else {
                currentEditNode.data.data = targetPreview;
            }

            refreshFormAndTextareaForCurrentPreview(nodeType);
            rebuildHierarchyPreserveExpanded();
            hideJsonModal();
        });

        const batchHint = document.createElement("div");
        batchHint.style.fontSize = "10px";
        batchHint.style.color = "#6b7280";
        batchHint.style.lineHeight = "1.4";
        batchHint.textContent = "提示：如果 ID 不包含命名空间（如 my_feature），将自动继承父节点的命名空间（如 ns:my_feature）。";

        batchBtnWrap.appendChild(batchAddBtn);
        batchBtnWrap.appendChild(batchHint);
        batchBtnRow.appendChild(batchBtnWrap);
        jsonModalFormContainer.appendChild(batchBtnRow);
    }

    function buildGenericTopLevelFields(preview, nodeType) {
        if (!preview || typeof preview !== "object") return;

        const keys = Object.keys(preview);
        if (!keys.length) return;

        // 简单的排序：常用字段靠前
        const priority = ["places_feature", "scatter_chance", "iterations", "features"];
        keys.sort((a, b) => {
            const pa = priority.indexOf(a);
            const pb = priority.indexOf(b);
            if (pa === -1 && pb === -1) return a.localeCompare(b);
            if (pa === -1) return 1;
            if (pb === -1) return -1;
            return pa - pb;
        });

        const title = document.createElement("div");
        title.style.fontSize = "10px";
        title.style.color = "#9ca3af";
        title.style.margin = "6px 0 2px 0";
        title.textContent = "顶层简单字段：";
        jsonModalFormContainer.appendChild(title);

        keys.forEach((key) => {
            // 特殊对象结构在专用表单里做（避免重复）
            if (key === "description" || key === "distribution") {
                return;
            }
            if (nodeType === "minecraft:structure_template_feature") {
                if (key === "constraints" || key === "adjustment_radius") return;
            }
            const value = preview[key];
            if (
                typeof value === "string" ||
                typeof value === "number" ||
                typeof value === "boolean"
            ) {
                appendSimpleFieldRow(key, key, value, typeof value);
            }
        });
    }

    function buildFormForPreview(preview, nodeType) {
        if (!jsonModalFormContainer) return;
        jsonModalFormContainer.innerHTML = "";

        if (!preview || typeof preview !== "object") {
            const div = document.createElement("div");
            div.textContent = "当前节点没有可用的结构化字段，可以切换到 JSON 模式进行编辑。";
            div.style.fontSize = "11px";
            div.style.color = "#9ca3af";
            jsonModalFormContainer.appendChild(div);
            return;
        }

        buildDescriptionSection(preview);

        if (nodeType === "minecraft:scatter_feature") {
            buildScatterSection(preview, nodeType);
            buildScatterChildSection(preview, nodeType);
        } else if (nodeType === "minecraft:snap_to_surface_feature") {
            buildSnapToSurfaceMissingChildSection(preview, nodeType);
        } else if (nodeType === "minecraft:structure_template_feature") {
            buildStructureTemplateSection(preview, nodeType);
        }

        buildGenericTopLevelFields(preview, nodeType);

        // aggregate_feature / weighted_random_feature 专用：添加“新增子节点”下拉
        buildAggregateChildSection(preview, nodeType);
        buildWeightedRandomChildSection(preview, nodeType);

        const hint = document.createElement("div");
        hint.style.marginTop = "4px";
        hint.style.fontSize = "10px";
        hint.style.color = "#6b7280";
        hint.textContent = "表单模式会优先提供常用字段（如 description.identifier、distribution.iterations 等），复杂对象/数组请切换到 JSON 模式处理。";
        jsonModalFormContainer.appendChild(hint);
    }

    async function exportAllFeatures() {
        if (!root) return;

        // 遍历数据层面的整棵树，而不是可见节点（避免折叠后丢失）
        const nodes = [];
        function collectDataNodes(dataNode) {
            if (!dataNode || typeof dataNode !== "object") return;
            nodes.push(dataNode);
            if (Array.isArray(dataNode.children)) {
                dataNode.children.forEach(child => collectDataNodes(child));
            }
        }
        collectDataNodes(root.data);

        const featureMap = new Map();

        nodes.forEach((node, index) => {
            const preview = node.data;
            if (!preview) return;

            // 根据节点类型包装成真正的 feature.json 结构：
            // {
            //   "format_version": "1.21.40",
            //   "minecraft:aggregate_feature": { ...preview... }
            // }
            let exportObject = preview;
            const nodeType = typeof node.type === "string" ? node.type : "";
            if (nodeType) {
                exportObject = {
                    format_version: DEFAULT_FEATURE_FORMAT_VERSION,
                };
                exportObject[nodeType] = preview;
            }

            // 文件名一律基于 identifier（去掉命名空间）
            const fileName = buildSafeFeatureFileName(node, index); // e.g. "root.json"
            let path = fileName;

            // 避免同名覆盖：重复时自动加后缀
            let finalPath = path;
            let counter = 1;
            while (featureMap.has(finalPath)) {
                const dot = path.lastIndexOf(".");
                const base = dot >= 0 ? path.slice(0, dot) : path;
                const ext = dot >= 0 ? path.slice(dot) : "";
                finalPath = `${base}__${counter}${ext}`;
                counter++;
            }

            featureMap.set(finalPath, exportObject);
        });

        if (featureMap.size === 0) {
            statusEl.textContent = "没有可导出的 feature（data 为空）。";
            return;
        }

        // 优先使用 File System Access API：只写一次 ZIP 文件到目标文件夹（避免多次文件写入触发杀毒扫描）
        if (window.showDirectoryPicker) {
            if (typeof JSZip === "undefined") {
                statusEl.textContent = "当前浏览器未加载 JSZip，无法导出 ZIP。";
            } else {
                try {
                    statusEl.textContent = "请选择要导出的目标文件夹……";
                    const startIn = await getDefaultDirHandle();
                    const dirHandle = await window.showDirectoryPicker({
                        mode: "readwrite",
                        startIn
                    });

                    // 在内存中构建 zip
                    const zip = new JSZip();
                    featureMap.forEach((previewObj, filePath) => {
                        let jsonStr;
                        try {
                            jsonStr = JSON.stringify(previewObj, null, 2);
                        } catch (e) {
                            jsonStr = String(previewObj);
                        }
                        zip.file(filePath, jsonStr);
                    });

                    const baseName = currentJsonFileName
                        ? currentJsonFileName.replace(/\.json$/i, "")
                        : "root_feature";
                    const zipName = `${baseName}_features.zip`;

                    statusEl.textContent = "正在生成压缩包……";
                    const zipBlob = await zip.generateAsync({ type: "blob" });

                    // 只写一次 ZIP 文件（只有这一次文件写入操作，避免多次触发杀毒扫描）
                    statusEl.textContent = "正在写入压缩包到目标文件夹……";
                    const zipFileHandle = await dirHandle.getFileHandle(zipName, { create: true });
                    const writable = await zipFileHandle.createWritable();
                    await writable.write(zipBlob);
                    await writable.close();

                    statusEl.textContent = `已将 ${featureMap.size} 个 feature 打包到 ${zipName}（请手动解压该 ZIP 文件）。`;
                    return;
                } catch (err) {
                    if (err && err.name === "AbortError") {
                        statusEl.textContent = "已取消选择导出文件夹。";
                        return;
                    }
                    console.error(err);
                    statusEl.textContent = "导出到文件夹失败，将尝试以压缩包形式下载。";
                    // 继续向下执行，回退为 zip 下载
                }
            }
        }

        // 回退：如果浏览器不支持目录选择器或写入失败，则仍然使用 zip 下载
        if (typeof JSZip === "undefined") {
            statusEl.textContent = "当前环境不支持文件夹导出，且未找到 JSZip，无法导出。";
            return;
        }

        const zip = new JSZip();
        featureMap.forEach((preview, filePath) => {
            let jsonStr;
            try {
                jsonStr = JSON.stringify(preview, null, 2);
            } catch (e) {
                jsonStr = String(preview);
            }
            zip.file(filePath, jsonStr);
        });

        const baseName = currentJsonFileName
            ? currentJsonFileName.replace(/\.json$/i, "")
            : "root_feature";
        const zipName = `${baseName}_features.zip`;

        zip.generateAsync({ type: "blob" })
            .then((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = zipName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                statusEl.textContent = `已将 ${featureMap.size} 个 feature 打包到压缩包：${zipName}`;
            })
            .catch((err) => {
                console.error(err);
                statusEl.textContent = "导出 feature 压缩包失败，请查看控制台。";
            });
    }

    function safeStableStringify(obj) {
        try {
            return JSON.stringify(obj);
        } catch (e) {
            return null;
        }
    }

    function applyJsonEdit(options) {
        if (!currentEditNode || !jsonModalTextarea) return;
        if (!root || !root.data) return;
        const closeOnSuccess = options && options.closeOnSuccess === false ? false : true;
        if (jsonModalError) {
            jsonModalError.textContent = "";
        }
        let updated = null;
        const nodeTypeForAutoSync = currentEditNode && currentEditNode.data && currentEditNode.data.type;
        const prevIterationsForAutoSync =
            currentEditNode &&
            currentEditNode.data &&
            currentEditNode.data.data &&
            currentEditNode.data.data.distribution &&
            typeof currentEditNode.data.data.distribution === "object"
                ? currentEditNode.data.data.distribution.iterations
                : undefined;

        if (currentEditorMode === "json") {
            const text = jsonModalTextarea.value.trim();
            if (!text) {
                if (jsonModalError) {
                    jsonModalError.textContent = "JSON 内容不能为空。";
                }
                return;
            }
            try {
                updated = JSON.parse(text);
            } catch (e) {
                if (jsonModalError) {
                    jsonModalError.textContent = "JSON 语法错误：" + e.message;
                }
                return;
            }
        } else {
            // 表单模式：从当前副本上修改简单字段
            updated = currentPreviewCopy && typeof currentPreviewCopy === "object"
                ? deepClone(currentPreviewCopy)
                : {};
            applyFormInputsToObject(updated);
        }

        // 未发生变化则不入历史栈（避免失焦自动保存刷爆撤销栈）
        const prevStr = safeStableStringify(currentEditNode.data && currentEditNode.data.data);
        const nextStr = safeStableStringify(updated);
        if (prevStr !== null && nextStr !== null && prevStr === nextStr) {
            if (closeOnSuccess) {
                hideJsonModal();
            }
            return;
        }

        // 如有需要，执行 identifier 重命名并同步所有引用
        const oldId = currentEditNode.data && currentEditNode.data.identifier;
        let newId = oldId;
        if (updated && updated.description && typeof updated.description === "object") {
            const cand = updated.description.identifier;
            if (typeof cand === "string" && cand) {
                newId = cand;
            }
        }
        if (oldId && newId && newId !== oldId) {
            // 不允许重名：新 identifier 已存在则拒绝保存（避免出现两份相同 identifier）
            if (identifierExistsInData(root.data, newId)) {
                if (jsonModalError) {
                    jsonModalError.textContent = `identifier 重名：${newId} 已存在，请换一个。`;
                }
                return;
            }
        }

        // 记录历史状态（确认校验通过后再入栈）
        HistoryManager.pushState(root.data);

        // 执行重命名并同步所有引用
        if (oldId && newId && newId !== oldId) {
            renameIdentifierEverywhere(oldId, newId);
        }

        currentEditNode.data.data = updated;
        update(currentEditNode);

        // 如果是 scatter_feature 且 iterations 发生变化：自动写回已存在的 molang 文件
        // （前提：用户之前通过 sync 机制创建/关联过对应文件）
        try {
            const nextIterationsForAutoSync =
                updated &&
                updated.distribution &&
                typeof updated.distribution === "object"
                    ? updated.distribution.iterations
                    : undefined;
            if (
                nodeTypeForAutoSync === "minecraft:scatter_feature" &&
                prevIterationsForAutoSync !== nextIterationsForAutoSync
            ) {
                const idForFile = currentEditNode && currentEditNode.data && currentEditNode.data.identifier;
                if (idForFile) {
                    scheduleAutoWriteIterationsMolang(idForFile, nextIterationsForAutoSync);
                }
            }
        } catch (e) {
            console.warn("自动同步 iterations 到 molang 的流程异常：", e);
        }

        // 如果当前节点已经有对应的 tools-feature/features/<id>.json 文件：每次保存后尝试把内存同步回文件
        try {
            const idForFeatureFile = currentEditNode && currentEditNode.data && currentEditNode.data.identifier;
            if (idForFeatureFile) {
                scheduleAutoWriteNodeFeatureFile(idForFeatureFile, currentEditNode.data);
            }
        } catch (e) {
            console.warn("自动同步节点到 features 文件的流程异常：", e);
        }

        // 同步当前草稿与标题（让用户继续编辑时内容一致）
        currentPreviewCopy = deepClone(updated);
        if (jsonModalTitle && newId) {
            jsonModalTitle.textContent = newId;
        }
        if (jsonModalTextarea && currentPreviewCopy) {
            try {
                jsonModalTextarea.value = JSON.stringify(currentPreviewCopy, null, 2);
            } catch (e) {
                jsonModalTextarea.value = String(currentPreviewCopy);
            }
        }

        if (closeOnSuccess) {
            hideJsonModal();
        } else {
            if (statusEl) statusEl.textContent = "已自动保存。";
        }
    }

    // 删除当前编辑的节点（仅允许叶子节点）
    function deleteCurrentNodeIfLeaf() {
        if (!currentEditNode || !root) return;

        const d = currentEditNode;

        // 不允许删除根节点
        if (d === root) {
            if (jsonModalError) {
                jsonModalError.textContent = "不能删除根节点。";
            }
            return;
        }

        // 只允许删除没有任何子节点（包括折叠子节点）的叶子节点
        const hasChildren =
            (d.children && d.children.length > 0) ||
            (d._children && d._children.length > 0);
        if (hasChildren) {
            if (jsonModalError) {
                jsonModalError.textContent = "当前节点仍有子节点，只能删除叶子节点。";
            }
            return;
        }

        const parent = d.parent;
        if (!parent || !Array.isArray(parent.data.children)) {
            if (jsonModalError) {
                jsonModalError.textContent = "找不到父节点，无法删除该节点。";
            }
            return;
        }

        const identifier = d.data && d.data.identifier;
        let idx = parent.data.children.findIndex(child => child === d.data);
        if (idx === -1 && identifier) {
            idx = parent.data.children.findIndex(
                child => child && child.identifier === identifier
            );
        }

        if (idx === -1) {
            if (jsonModalError) {
                jsonModalError.textContent = "在父节点 children 中未找到该节点，删除失败。";
            }
            return;
        }

        // 记录历史状态
        if (root && root.data) {
            HistoryManager.pushState(root.data);
        }

        // 移除父节点引用
        removeReferenceFromParent(parent.data, identifier);

        parent.data.children.splice(idx, 1);

        // 关闭编辑窗口并重建层级树，保留展开状态
        hideJsonModal();
        rebuildHierarchyPreserveExpanded();

        if (statusEl) {
            statusEl.textContent = `已删除节点：${identifier || "(无 identifier)"}`;
        }
    }

    // Ctrl + 左键打开右侧侧边栏编辑器
    function showJsonModal(d) {
        if (!jsonSidebarEditor) return;

        currentEditNode = d;

        const id = d.data.identifier || "(无 identifier)";
        const type = d.data.type || "(无 type)";

        jsonModalTitle.textContent = id;
        jsonModalMeta.textContent = `${type}`;

        const preview = d.data.data && typeof d.data.data === "object"
            ? d.data.data
            : {};

        currentPreviewCopy = deepClone(preview || {});

        buildFormForPreview(currentPreviewCopy, type);

        if (jsonModalTextarea) {
            try {
                jsonModalTextarea.value = JSON.stringify(currentPreviewCopy, null, 2);
            } catch (e) {
                jsonModalTextarea.value = String(currentPreviewCopy);
            }
        }

        if (jsonModalError) {
            jsonModalError.textContent = "";
        }

        setEditorMode("form");
        jsonSidebarEditor.classList.add("sidebar-editor--open");
    }

    function hideJsonModal() {
        if (!jsonSidebarEditor) return;
        jsonSidebarEditor.classList.remove("sidebar-editor--open");
        currentEditNode = null;
    }

    // ---------- 拖拽重排序逻辑 ----------
    // 需求：避免单长按误触 -> 改为“按住 Alt + 长按”才进入拖拽（保留 d3.drag）
    const ALT_DRAG_LONG_PRESS_MS = 220;          // Alt 长按多久才算进入拖拽
    const SUPPRESS_CLICK_AFTER_DRAG_MS = 260;    // 拖拽结束后短暂屏蔽 click，避免误触展开/折叠

    let suppressNodeClickUntil = 0;
    let dragState = null; // { sourceNode, ghost, targetNode, action: 'reparent'|'before'|'after' }
    let dragPending = null; // { sourceNode, el, timerId, lastPointer: [x,y] }

    function cancelPendingDrag() {
        if (!dragPending) return;
        if (dragPending.timerId) clearTimeout(dragPending.timerId);
        dragPending = null;
    }

    function activatePendingDrag() {
        if (!dragPending || !dragPending.sourceNode) return;
        const d = dragPending.sourceNode;
        const el = dragPending.el;

        dragState = {
            sourceNode: d,
            ghost: null,
            targetNode: null,
            action: null
        };

        // 创建幽灵节点（初始放在源节点位置；后续 onDrag 会更新到鼠标位置）
        const ghost = g.append("g")
            .attr("class", "ghost-node")
            .attr("transform", `translate(${d.y},${d.x})`);

        ghost.append("circle").attr("r", 7);
        ghost.append("text")
            .attr("dy", "0.32em")
            .attr("x", 10)
            .text(nodeLabel(d));

        dragState.ghost = ghost;

        // 给原节点添加样式
        if (el) {
            d3.select(el).classed("node--dragging", true);
        }

        // 一旦进入真正拖拽，pending 状态就可以丢弃
        dragPending = null;
    }

    function isDescendant(parent, child) {
        if (!parent || !child) return false;
        if (parent === child) return true;
        if (parent.children) {
            return parent.children.some(c => isDescendant(c, child));
        }
        return false;
    }

    // 移除旧父节点对子节点的引用（更新 data）
    function removeReferenceFromParent(parentData, childId) {
        if (!parentData || !parentData.data || !childId) return null;
        const type = parentData.type;
        const preview = parentData.data;

        if (type === "minecraft:aggregate_feature") {
            if (Array.isArray(preview.features)) {
                const idx = preview.features.indexOf(childId);
                if (idx !== -1) {
                    preview.features.splice(idx, 1);
                    return { type: "aggregate" };
                }
            }
        } else if (type === "minecraft:weighted_random_feature") {
            if (Array.isArray(preview.features)) {
                const idx = preview.features.findIndex(f => Array.isArray(f) && f[0] === childId);
                if (idx !== -1) {
                    const removed = preview.features.splice(idx, 1)[0];
                    const weight = Array.isArray(removed) && removed.length >= 2 ? removed[1] : 1;
                    return { type: "weighted", weight: weight };
                }
            }
        } else if (type === "minecraft:scatter_feature") {
            if (preview.places_feature === childId) {
                preview.places_feature = "";
                return { type: "scatter" };
            }
        } else if (type === "minecraft:snap_to_surface_feature") {
            if (preview.feature_to_snap === childId) {
                preview.feature_to_snap = "";
                return { type: "snap" };
            }
        }
        return null;
    }

    // 添加新父节点对子节点的引用（更新 preview）
    function addReferenceToParent(parentData, childId, insertIndex, extraInfo) {
        if (!parentData || !parentData.data || !childId) return;
        const type = parentData.type;
        const preview = parentData.data;

        if (type === "minecraft:aggregate_feature") {
            if (!Array.isArray(preview.features)) preview.features = [];
            if (insertIndex === -1 || insertIndex >= preview.features.length) {
                preview.features.push(childId);
            } else {
                preview.features.splice(insertIndex, 0, childId);
            }
        } else if (type === "minecraft:weighted_random_feature") {
            if (!Array.isArray(preview.features)) preview.features = [];
            // 如果之前也是带权重的，保留权重，否则默认 1
            const weight = (extraInfo && extraInfo.type === "weighted" && typeof extraInfo.weight === "number") 
                ? extraInfo.weight 
                : 1;
            const newEntry = [childId, weight];
            if (insertIndex === -1 || insertIndex >= preview.features.length) {
                preview.features.push(newEntry);
            } else {
                preview.features.splice(insertIndex, 0, newEntry);
            }
        } else if (type === "minecraft:scatter_feature") {
            preview.places_feature = childId;
        } else if (type === "minecraft:snap_to_surface_feature") {
            preview.feature_to_snap = childId;
        }
    }

    function isAggregateDataNode(data) {
        return !!(data && typeof data === "object" && data.type === "minecraft:aggregate_feature");
    }

    function isScatterDataNode(data) {
        return !!(data && typeof data === "object" && data.type === "minecraft:scatter_feature");
    }

    function ensureScatterHasAggregateWrapper(scatterData) {
        // 目标：保证 scatter 只有 1 个直连子节点，且该子节点是 aggregate（用于承载多个实际子节点）
        if (!isScatterDataNode(scatterData)) return null;
        if (!scatterData.data || typeof scatterData.data !== "object") scatterData.data = {};
        if (!Array.isArray(scatterData.children)) scatterData.children = [];

        const placesId = typeof scatterData.data.places_feature === "string" ? scatterData.data.places_feature : "";

        // 已经是：scatter -> aggregate(wrapper) 的结构，直接复用
        if (
            scatterData.children.length === 1 &&
            isAggregateDataNode(scatterData.children[0]) &&
            scatterData.children[0].identifier &&
            scatterData.children[0].identifier === placesId
        ) {
            const agg = scatterData.children[0];
            if (!agg.data || typeof agg.data !== "object") {
                agg.data = createTemplatePreviewForType("minecraft:aggregate_feature", agg.identifier);
            }
            if (!Array.isArray(agg.children)) agg.children = [];
            if (!Array.isArray(agg.data.features)) agg.data.features = [];
            return agg;
        }

        // scatter 没有子节点时，不需要包裹（返回 null 代表“保持原逻辑”）
        if (scatterData.children.length === 0) return null;

        // 需要创建一个新的 aggregate wrapper，把 scatter 原有的子节点整体搬进去
        const parentId = scatterData.identifier || "namespace:feature";
        const wrapperId = generateChildIdentifier(parentId + "_wrap", "minecraft:aggregate_feature");
        const wrapperPreview = createTemplatePreviewForType("minecraft:aggregate_feature", wrapperId);

        const movedChildren = scatterData.children.slice(); // 保留原顺序
        const wrapperNode = {
            identifier: wrapperId,
            type: "minecraft:aggregate_feature",
            data: wrapperPreview,
            children: movedChildren,
        };

        // aggregate 的 features 列表要与 children 顺序一致
        wrapperPreview.features = movedChildren
            .map(c => (c && typeof c === "object" ? c.identifier : ""))
            .filter(Boolean);

        // scatter 只保留一个子节点：wrapper
        scatterData.children = [wrapperNode];
        scatterData.data.places_feature = wrapperId;

        return wrapperNode;
    }

    // 核心数据移动逻辑
    function moveDataNode(sourceNode, targetNode, action) {
        if (!sourceNode || !targetNode || !action) return;
        const sourceData = sourceNode.data;
        const targetData = targetNode.data;
        
        // 1. 从原父节点移除
        const oldParent = sourceNode.parent;
        if (!oldParent || !oldParent.data || !Array.isArray(oldParent.data.children)) return;
        
        const oldIdx = oldParent.data.children.indexOf(sourceData);
        if (oldIdx === -1) return;
        
        // 移除引用并获取额外信息
        const extraInfo = removeReferenceFromParent(oldParent.data, sourceData.identifier);
        
        oldParent.data.children.splice(oldIdx, 1);

        // 2. 插入到新位置
        if (action === "reparent") {
            // 成为 target 的子节点
            if (!Array.isArray(targetData.children)) {
                targetData.children = [];
            }

            // scatter_feature 特殊处理：
            // - scatter 语义上只能指向 1 个子节点（places_feature）
            // - 当 scatter 已有子节点时，新增子节点应自动插入 aggregate wrapper：
            //   scatter -> aggregate(wrapper) -> [oldChild, newChild]
            if (isScatterDataNode(targetData) && targetData.children.length > 0) {
                const agg = ensureScatterHasAggregateWrapper(targetData);
                if (agg) {
                    if (!Array.isArray(agg.children)) agg.children = [];
                    const insertIdx = agg.children.length; // 默认追加到末尾
                    agg.children.splice(insertIdx, 0, sourceData);
                    addReferenceToParent(agg, sourceData.identifier, insertIdx, extraInfo);
                } else {
                    // 理论上不会走到这里（length>0），但保险起见保留旧逻辑
                    targetData.children.push(sourceData);
                    addReferenceToParent(targetData, sourceData.identifier, -1, extraInfo);
                }
            } else {
                targetData.children.push(sourceData);
                // 添加引用
                addReferenceToParent(targetData, sourceData.identifier, -1, extraInfo);
            }
            
            // 如果 target 原本是折叠的，需要展开以便看到新加入的节点
            // 但这里我们操作的是 data，视图状态在 d3 node 上
            // 简单起见，我们让 targetNode 自动展开
            if (targetNode._children) {
                targetNode.children = targetNode._children;
                targetNode._children = null;
            }
        } else if (action === "before" || action === "after") {
            // 插入到 target 的兄弟位置
            const newParent = targetNode.parent;
            if (!newParent || !newParent.data || !Array.isArray(newParent.data.children)) {
                // 如果 target 是根节点，没有 parent，无法插入兄弟
                // 恢复原位（回滚）
                oldParent.data.children.splice(oldIdx, 0, sourceData);
                addReferenceToParent(oldParent.data, sourceData.identifier, oldIdx, extraInfo);
                return;
            }
            
            const targetIdx = newParent.data.children.indexOf(targetData);
            if (targetIdx === -1) {
                oldParent.data.children.splice(oldIdx, 0, sourceData);
                addReferenceToParent(oldParent.data, sourceData.identifier, oldIdx, extraInfo);
                return;
            }

            // 如果 newParent 是 scatter_feature：不能让它出现 2 个直连子节点
            // 将行为改为：确保 scatter 下有 aggregate wrapper，然后把 source 插入到 wrapper.children 中。
            if (isScatterDataNode(newParent.data)) {
                const usedAgg = ensureScatterHasAggregateWrapper(newParent.data);

                if (!usedAgg) {
                    // 回退：保持原逻辑（尽量不丢数据）
                    const insertIdx = action === "before" ? targetIdx : targetIdx + 1;
                    newParent.data.children.splice(insertIdx, 0, sourceData);
                    addReferenceToParent(newParent.data, sourceData.identifier, insertIdx, extraInfo);
                    return;
                }

                if (!Array.isArray(usedAgg.children)) usedAgg.children = [];

                // 计算插入位置：如果 target 本身就是 wrapper，则 before=开头 / after=末尾
                let idxInAgg = -1;
                if (targetData && targetData.identifier) {
                    idxInAgg = usedAgg.children.findIndex(c => c && c.identifier === targetData.identifier);
                }

                let insertIdxInAgg;
                if (targetData && targetData.identifier && targetData.identifier === usedAgg.identifier) {
                    insertIdxInAgg = action === "before" ? 0 : usedAgg.children.length;
                } else if (idxInAgg === -1) {
                    insertIdxInAgg = usedAgg.children.length;
                } else {
                    insertIdxInAgg = action === "before" ? idxInAgg : idxInAgg + 1;
                }

                usedAgg.children.splice(insertIdxInAgg, 0, sourceData);
                addReferenceToParent(usedAgg, sourceData.identifier, insertIdxInAgg, extraInfo);
                return;
            }

            const insertIdx = action === "before" ? targetIdx : targetIdx + 1;
            newParent.data.children.splice(insertIdx, 0, sourceData);
            // 添加引用
            addReferenceToParent(newParent.data, sourceData.identifier, insertIdx, extraInfo);
        }
    }

    function isContainerNode(data) {
        const t = (data && data.type) || "";
        return (
            t === "minecraft:aggregate_feature" ||
            t === "minecraft:weighted_random_feature" ||
            t === "minecraft:scatter_feature" ||
            t === "minecraft:snap_to_surface_feature" ||
            t === "minecraft:conditional_list" ||
            t === "minecraft:sequence_feature" ||
            t === "minecraft:rect_layout_feature" ||
            t === "minecraft:scan_surface_feature"
        );
    }

    function onDragStart(event, d) {
        // 禁止拖拽根节点
        if (!d.parent) return;

        // 仅在按住 Alt 时允许进入拖拽（额外还有长按门槛）
        const src = event && event.sourceEvent;
        if (!src || !src.altKey) return;

        // 阻止事件冒泡，避免触发 zoom
        src.stopPropagation();

        // 开始计时：只有 Alt + 长按达到阈值，才真正进入拖拽
        cancelPendingDrag();
        dragPending = {
            sourceNode: d,
            el: this,
            timerId: null,
            lastPointer: null
        };
        dragPending.timerId = setTimeout(() => {
            // 到点再真正激活拖拽
            activatePendingDrag();
        }, ALT_DRAG_LONG_PRESS_MS);
    }

    function onDrag(event, d) {
        // 还在“长按等待期”：记录一下当前鼠标位置，但不触发任何拖拽逻辑
        if (dragPending && dragPending.sourceNode === d) {
            try {
                dragPending.lastPointer = d3.pointer(event, g.node());
            } catch (e) {
                // ignore
            }
            return;
        }

        if (!dragState || !dragState.ghost) return;

        // 使用 d3.pointer 获取相对于 g 容器的准确坐标 [x, y]
        // x 是水平方向，y 是垂直方向
        const [mx, my] = d3.pointer(event, g.node());

        // 更新幽灵节点位置
        dragState.ghost.attr("transform", `translate(${mx},${my})`);

        // 命中测试：寻找最近的节点
        // 简单的欧几里得距离，或者直接利用 DOM 元素判定
        // 由于节点较多，遍历计算距离可能较慢，但对于 < 1000 节点通常没问题
        // 优化：只计算可见节点
        
        let minDist = Infinity;
        let closest = null;
        
        // 遍历所有可见节点
        g.selectAll("g.node").each(function(node) {
            if (node === dragState.sourceNode) return; // 忽略自己
            
            // 计算距离
            // node.y 是水平坐标，node.x 是垂直坐标
            const dx = node.y - mx;
            const dy = node.x - my;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // 阈值：距离小于 40px 才吸附
            if (dist < 40 && dist < minDist) {
                minDist = dist;
                closest = node;
            }
        });

        // 清除旧的高亮
        g.selectAll("g.node")
            .classed("node--target-reparent", false)
            .classed("node--target-before", false)
            .classed("node--target-after", false);
            
        dragState.targetNode = null;
        dragState.action = null;

        if (closest) {
            // 检查合法性：不能拖到自己的子孙节点下
            if (isDescendant(dragState.sourceNode, closest)) return;

            // 判定动作类型
            // 垂直方向差值：dy = closest.x - my
            // my < closest.x -> 鼠标在节点上方
            const dy = my - closest.x; // 正数表示鼠标在节点下方，负数在上方
            
            let action = "reparent";
            const canReparent = isContainerNode(closest.data);

            if (!canReparent) {
                // 如果目标不支持子节点（即叶子节点），则强制改为插入到其上方或下方
                // 以 dy=0 为界：上方为 before，下方为 after
                action = dy < 0 ? "before" : "after";
            } else {
                // 如果目标是容器节点，保留中心 reparent 区域
                // -8 < dy < 8 : Reparent
                // dy <= -8    : Insert Before
                // dy >= 8     : Insert After
                if (dy < -8) action = "before";
                else if (dy > 8) action = "after";
            }
            
            // 根节点不能有兄弟，所以如果是根节点，只能 reparent
            if (!closest.parent && action !== "reparent") {
                action = canReparent ? "reparent" : null;
            }

            dragState.targetNode = closest;
            dragState.action = action;
            
            // 应用高亮样式
            const targetSel = g.selectAll("g.node").filter(n => n === closest);
            targetSel.classed(`node--target-${action}`, true);
        }
    }

    function onDragEnd(event, d) {
        // 如果尚未进入真正拖拽（只是 Alt 长按等待），这里要取消 pending
        if (dragPending && dragPending.sourceNode === d) {
            cancelPendingDrag();
            return;
        }
        if (!dragState) return;
        
        // 移除幽灵节点
        if (dragState.ghost) {
            dragState.ghost.remove();
        }
        
        // 移除原节点样式
        d3.select(this).classed("node--dragging", false);
        
        // 移除所有高亮
        g.selectAll("g.node")
            .classed("node--target-reparent", false)
            .classed("node--target-before", false)
            .classed("node--target-after", false);

        // 执行移动
        if (dragState.targetNode && dragState.action) {
            const { sourceNode, targetNode, action } = dragState;
            
            // 记录历史
            HistoryManager.pushState(root.data);
            
            // 修改数据
            moveDataNode(sourceNode, targetNode, action);
            
            // 重建视图
            rebuildHierarchyPreserveExpanded();
            
            statusEl.textContent = `已移动节点: ${nodeLabel(sourceNode)} -> ${action} ${nodeLabel(targetNode)}`;
        }

        // 拖拽结束后，短暂屏蔽节点 click（避免误触展开/折叠）
        try {
            suppressNodeClickUntil = performance.now() + SUPPRESS_CLICK_AFTER_DRAG_MS;
        } catch (e) {
            suppressNodeClickUntil = Date.now() + SUPPRESS_CLICK_AFTER_DRAG_MS;
        }

        dragState = null;
    }

    function update(source) {
        const duration = 250;
        const nodes = root.descendants().reverse();
        const links = root.links();

        // 重新布局
        tree(root);

        let left = root;
        let right = root;
        root.eachBefore(node => {
            if (node.x < left.x) left = node;
            if (node.x > right.x) right = node;
        });

        const height = Math.max(500, right.x - left.x + 160);
        svg.attr("viewBox", [0, 0, svg.node().clientWidth || 1200, height]);

        const transition = svg.transition()
            .duration(duration)
            .tween("resize", window.ResizeObserver ? null : () => () => svg.dispatch("toggle"));

        // 节点
        const node = g.selectAll("g.node")
            .data(nodes, d => d.id || (d.id = `${d.data.identifier || ""}-${d.depth}-${d.index}`));

        const nodeEnter = node.enter().append("g")
            .attr("class", d => nodeClass(d))
            .attr("transform", () => `translate(${source.y0 || 0},${source.x0 || 0})`)
            .call(
                d3.drag()
                    // 先用 filter 把“非 Alt”直接过滤掉（普通点击/长按不会触发 drag 行为）
                    .filter((event) => {
                        try {
                            return !!(event && event.altKey);
                        } catch (e) {
                            return false;
                        }
                    })
                    .on("start", onDragStart)
                    .on("drag", onDrag)
                    .on("end", onDragEnd)
            )
            .on("contextmenu", (event, d) => {
                // 右键：打开右侧侧边栏编辑器
                event.preventDefault();
                event.stopPropagation();
                showJsonModal(d);
            })
            .on("click", (event, d) => {
                // 如果刚刚完成拖拽，短时间内忽略 click（避免误触展开/折叠）
                try {
                    const now = performance.now();
                    if (suppressNodeClickUntil && now < suppressNodeClickUntil) {
                        event.stopPropagation();
                        return;
                    }
                } catch (e) {
                    const now = Date.now();
                    if (suppressNodeClickUntil && now < suppressNodeClickUntil) {
                        event.stopPropagation();
                        return;
                    }
                }

                // Ctrl + 单击：弹出 JSON 预览模态框
                if (event.ctrlKey) {
                    event.stopPropagation();
                    showJsonModal(d);
                    return;
                }

                // 按住 Shift + 单击：展开该节点的整个子树
                // 使用全局 isShiftPressed，而不是直接依赖 event.shiftKey，
                // 避免在某些环境中 Shift 状态“粘住”，导致后续普通点击也触发全量展开。
                if (isShiftPressed) {
                    event.stopPropagation();
                    expandSubtree(d);
                    return;
                }

                // 普通单击：只切换当前节点的直接子节点展开/折叠
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            })
            .on("mousemove", showTooltip)
            .on("mouseleave", hideTooltip);

        nodeEnter.append("circle")
            .attr("r", 1e-6);

        nodeEnter.append("text")
            .attr("dy", "0.32em")
            .attr("x", d => d.children || d._children ? -10 : 10)
            .attr("text-anchor", d => d.children || d._children ? "end" : "start")
            .text(nodeLabel)
            .clone(true).lower()
            .attr("stroke-linejoin", "round")
            .attr("stroke-width", 3)
            .attr("stroke", "#020617");

        const nodeUpdate = node.merge(nodeEnter)
            .transition(transition)
            .attr("class", d => nodeClass(d))
            .attr("transform", d => `translate(${d.y},${d.x})`);

        nodeUpdate.select("circle")
            .attr("r", 7);

        // 更新文本内容与对齐方式，保证修改名称后能即时反映在节点上
        nodeUpdate.selectAll("text")
            .attr("x", d => d.children || d._children ? -10 : 10)
            .attr("text-anchor", d => d.children || d._children ? "end" : "start")
            .text(nodeLabel);

        const nodeExit = node.exit().transition(transition)
            .remove()
            .attr("transform", () => `translate(${source.y},${source.x})`)
            .style("opacity", 0);

        nodeExit.select("circle")
            .attr("r", 1e-6);

        // 连线
        const link = g.selectAll("path.link")
            .data(links, d => d.target.id);

        const linkEnter = link.enter().insert("path", "g")
            .attr("class", "link")
            .attr("d", () => {
                const o = { x: source.x0 || 0, y: source.y0 || 0 };
                return stepPath({ source: o, target: o });
            });

        link.merge(linkEnter).transition(transition)
            .attr("d", stepPath);

        link.exit().transition(transition)
            .remove()
            .attr("d", () => {
                const o = { x: source.x, y: source.y };
                return stepPath({ source: o, target: o });
            });

        // 记住旧位置
        root.eachBefore(d => {
            d.x0 = d.x;
            d.y0 = d.y;
        });
    }

    function collapseToDepth(d, depth) {
        if (d.children) {
            d.children.forEach(child => collapseToDepth(child, depth));
        }
        if (d.depth >= depth && d.children) {
            d._children = d.children;
            d.children = null;
        }
    }

    function expandAll(d) {
        if (d._children) {
            d.children = d._children;
            d._children = null;
        }
        if (d.children) {
            d.children.forEach(expandAll);
        }
    }

    // 展开某个节点的整个子树（供需要时直接调用）
    function expandSubtree(d) {
        expandAll(d);
        update(d);
    }

    // 关闭侧边栏编辑器：右上角 × / 取消按钮 / Esc

    if (jsonModalClose) {
        jsonModalClose.addEventListener("click", () => {
            hideJsonModal();
        });
    }

    if (jsonModalCancel) {
        jsonModalCancel.addEventListener("click", () => {
            hideJsonModal();
        });
    }

    if (jsonModalApply) {
        jsonModalApply.addEventListener("click", () => {
            // 手动保存：不关闭侧边栏（与自动保存一致）
            applyJsonEdit({ closeOnSuccess: false });
        });
    }

    if (jsonModalDelete) {
        jsonModalDelete.addEventListener("click", () => {
            deleteCurrentNodeIfLeaf();
        });
    }

    function isTextEditingInSidebar() {
        if (!jsonSidebarEditor) return false;
        if (!jsonSidebarEditor.classList.contains("sidebar-editor--open")) return false;
        const el = document.activeElement;
        if (!el) return false;
        const tag = el.tagName;
        if (tag !== "INPUT" && tag !== "TEXTAREA") return false;
        return jsonSidebarEditor.contains(el);
    }

    document.addEventListener("keydown", (e) => {
        // 独立维护 Shift 状态，避免依赖单次事件上的 shiftKey
        if (e.key === "Shift") {
            isShiftPressed = true;
            return;
        }

        if (e.key === "Escape") {
            hideJsonModal();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            // Ctrl+Z：在编辑文本时走浏览器原生撤销；否则走节点撤销
            if (isTextEditingInSidebar()) return;
            e.preventDefault();
            if (undoBtn && !undoBtn.disabled) undoBtn.click();
        } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.shiftKey && e.key.toLowerCase() === "z"))) {
            // Ctrl+Y / Ctrl+Shift+Z：在编辑文本时走浏览器原生重做；否则走节点重做
            if (isTextEditingInSidebar()) return;
            e.preventDefault();
            if (redoBtn && !redoBtn.disabled) redoBtn.click();
        } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
            // 在编辑对话框中 Ctrl+Enter / Cmd+Enter 快速保存
            if (jsonSidebarEditor && jsonSidebarEditor.classList.contains("sidebar-editor--open")) {
                applyJsonEdit({ closeOnSuccess: false });
            }
        }
    });

    // 失去焦点自动保存（侧边栏内 input/textarea）
    let autoSaveTimer = null;
    function scheduleAutoSave() {
        if (!jsonSidebarEditor) return;
        if (!jsonSidebarEditor.classList.contains("sidebar-editor--open")) return;
        if (!currentEditNode) return;
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => {
            applyJsonEdit({ closeOnSuccess: false });
        }, 120);
    }

    if (jsonSidebarEditor) {
        jsonSidebarEditor.addEventListener("focusout", (e) => {
            const t = e.target;
            if (!t) return;
            const tag = t.tagName;
            if (tag !== "INPUT" && tag !== "TEXTAREA") return;
            scheduleAutoSave();
        });
    }

    document.addEventListener("keyup", (e) => {
        // 松开 Alt：如果还在等待长按进入拖拽，直接取消（避免 Alt 松开后仍误触拖拽）
        if (e.key === "Alt") {
            cancelPendingDrag();
        }
        if (e.key === "Shift") {
            isShiftPressed = false;
        }
    });

    if (switchFormModeBtn) {
        switchFormModeBtn.addEventListener("click", () => {
            if (!currentPreviewCopy || typeof currentPreviewCopy !== "object") return;
            buildFormForPreview(currentPreviewCopy, currentEditNode && currentEditNode.data && currentEditNode.data.type);
            setEditorMode("form");
        });
    }

    if (switchJsonModeBtn) {
        switchJsonModeBtn.addEventListener("click", () => {
            // 从当前表单刷新一次 JSON 文本，更直观
            if (currentEditorMode === "form" && currentPreviewCopy && typeof currentPreviewCopy === "object" && jsonModalFormContainer) {
                applyFormInputsToObject(currentPreviewCopy);
            }

            if (jsonModalTextarea && currentPreviewCopy) {
                try {
                    jsonModalTextarea.value = JSON.stringify(currentPreviewCopy, null, 2);
                } catch (e) {
                    jsonModalTextarea.value = String(currentPreviewCopy);
                }
            }
            setEditorMode("json");
        });
    }

    // 统一的树初始化逻辑，供文件选择 / File System Access 共用
    function initTreeFromData(data, fileName) {
        try {
            currentJsonFileName = fileName || null;
            initSvg();

            root = d3.hierarchy(data, d => d.children);
            root.x0 = 0;
            root.y0 = 0;

            // 默认只展开前两层，避免一次性渲染过多节点
            root.descendants().forEach(d => {
                if (d.children && d.children.length) {
                    d._children = d.children;
                }
            });
            collapseToDepth(root, 2);

            update(root);
            statusEl.textContent = `已加载: ${fileName || "root_feature.json"}（节点数约 ${root.descendants().length}）`;
        } catch (err) {
            console.error(err);
            statusEl.textContent = "解析 JSON 失败，请确认文件格式正确。";
        }
    }

    function loadJsonFromFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                initTreeFromData(data, file.name || null);
            } catch (err) {
                console.error(err);
                statusEl.textContent = "解析 JSON 失败，请确认文件格式正确。";
            }
        };
        reader.readAsText(file, "utf-8");
    }

    // 使用 File System Access API 打开原始 root_feature.json（如浏览器支持）
    async function openRootJsonWithPicker() {
        if (!window.showOpenFilePicker) {
            // 回退到传统 <input type="file">
            if (fileInput) {
                fileInput.click();
            }
            return;
        }
        try {
            const startIn = await getDefaultDirHandle();
            const [handle] = await window.showOpenFilePicker({
                multiple: false,
                startIn,
                types: [
                    {
                        description: "JSON 文件",
                        accept: { "application/json": [".json"] },
                    },
                ],
            });
            if (!handle) return;
            currentFileHandle = handle;
            const file = await handle.getFile();
            const text = await file.text();
            const data = JSON.parse(text);
            initTreeFromData(data, file.name || null);
            statusEl.textContent += "（已获得写入权限，可直接保存覆盖原文件）";
        } catch (err) {
            if (err && err.name === "AbortError") {
                statusEl.textContent = "已取消选择文件。";
            } else {
                console.error(err);
                statusEl.textContent = "读取 root_feature.json 失败，请查看控制台。";
            }
        }
    }

    // 保存当前树到原始 root_feature.json：
    // - 优先使用 File System Access API 直接覆盖原文件（需要之前通过 openRootJsonWithPicker 或 createNewRootJson 打开/创建）
    // - 不支持时自动退回到“导出整棵树 JSON”下载方式
    async function saveRootJson() {
        if (!root) {
            statusEl.textContent = "当前还没有加载任何 root_feature.json。";
            return;
        }

        const jsonStr = JSON.stringify(root.data, null, 2);

        // 如果之前通过 File System Access 打开过文件，则可以直接写回原文件
        if (currentFileHandle && currentFileHandle.createWritable) {
            try {
                const writable = await currentFileHandle.createWritable();
                await writable.write(jsonStr);
                await writable.close();
                statusEl.textContent = `已直接保存到原文件：${currentJsonFileName || currentFileHandle.name || "root_feature.json"}`;

                // 保存后：把 tools-feature/features 里“已存在的节点文件”用内存数据回写一次，保持一致性
                await syncAllExistingFeatureFilesFromMemory();
                return;
            } catch (err) {
                if (err && err.name === "AbortError") {
                    statusEl.textContent = "已取消保存。";
                    return;
                }
                console.error(err);
                statusEl.textContent = "直接保存到原文件失败，将退回到下载导出方式。";
            }
        }

        // 没有写入句柄，或写入失败：退回为下载导出
        exportRootJson();

        // 即使是导出模式，也尽力做一次 features 回写（如果浏览器支持且已授权）
        await syncAllExistingFeatureFilesFromMemory();
    }

    // 新建一个 root_feature.json：
    // - 如支持 File System Access，则先弹出“另存为”对话框，让用户选择保存路径/文件名，
    //   立即写入一个默认的空 root_feature.json，并以后续“保存 root_feature.json” 直接覆盖该文件。
    // - 如不支持，则退回为仅在内存中创建，后续需用“导出整棵树 JSON”手动保存。
    async function createNewRootJson() {
        try {
            const defaultId = "namespace:new_root_feature";
            const data = {
                identifier: defaultId,
                type: "minecraft:aggregate_feature",
                data: {
                    description: {
                        identifier: defaultId,
                    },
                    features: [],
                },
                children: [],
            };

            // 默认文件名
            currentJsonFileName = "root_feature.json";
            currentFileHandle = null;

            if (window.showSaveFilePicker) {
                try {
                    const startIn = await getDefaultDirHandle();
                    const handle = await window.showSaveFilePicker({
                        suggestedName: "root_feature.json",
                        startIn,
                        types: [
                            {
                                description: "JSON 文件",
                                accept: { "application/json": [".json"] },
                            },
                        ],
                    });

                    if (handle) {
                        currentFileHandle = handle;
                        const writable = await handle.createWritable();
                        const jsonStr = JSON.stringify(data, null, 2);
                        await writable.write(jsonStr);
                        await writable.close();

                        const fileName = handle.name || "root_feature.json";
                        currentJsonFileName = fileName;

                        // 以刚刚写入文件的内容为基础初始化树
                        initTreeFromData(data, fileName);
                        statusEl.textContent = `已创建并保存新的 root_feature：${fileName}（后续可直接使用“保存 root_feature.json”覆盖该文件）`;
                        return;
                    }
                } catch (err) {
                    if (err && err.name === "AbortError") {
                        statusEl.textContent = "已取消新建 root_feature.json。";
                        return;
                    }
                    console.error(err);
                    statusEl.textContent = "保存新建 root_feature.json 到指定路径失败，将仅在内存中创建。";
                }
            }

            // 不支持 File System Access 或保存失败：仅在内存中创建一个新 root
            initTreeFromData(data, currentJsonFileName);
            statusEl.textContent = "已在内存中创建新的 root_feature.json（当前仅 1 个根节点，如需保存请使用“导出整棵树 JSON”）。";
        } catch (err) {
            console.error(err);
            statusEl.textContent = "新建 root_feature 失败，请查看控制台。";
        }
    }

    if (fileInput) {
        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            statusEl.textContent = "正在加载...";
            loadJsonFromFile(file);
        });
    }

    if (openRootBtn) {
        openRootBtn.addEventListener("click", () => {
            // 支持 File System Access 时优先走原文件句柄（可一键保存）
            if (window.showOpenFilePicker) {
                openRootJsonWithPicker();
            } else if (fileInput) {
                // 兼容旧浏览器：退回到传统文件选择
                fileInput.click();
            }
        });
    }

    if (newRootBtn) {
        newRootBtn.addEventListener("click", () => {
            // 使用新的逻辑：先让用户选择保存路径（如浏览器支持），再创建并初始化树
            createNewRootJson();
        });
    }

    if (exportTreeBtn) {
        exportTreeBtn.addEventListener("click", () => {
            exportRootJson();
        });
    }

    if (exportFeaturesBtn) {
        exportFeaturesBtn.addEventListener("click", () => {
            exportAllFeatures();
        });
    }

    if (saveRootBtn) {
        saveRootBtn.addEventListener("click", () => {
            saveRootJson();
        });
    }

    if (syncMolangsBtn) {
        syncMolangsBtn.addEventListener("click", async () => {
            await syncAllMolangsToNodes();
        });
    }

    if (nodeSyncBtn) {
        nodeSyncBtn.addEventListener("click", async () => {
            await syncCurrentNodeFeatureFile();
        });
    }


    // 路径管理 UI 逻辑
    const workDirSelect = document.getElementById("workDirSelect");
    const addWorkDirBtn = document.getElementById("addWorkDirBtn");
    const removeWorkDirBtn = document.getElementById("removeWorkDirBtn");

    async function refreshWorkDirSelect() {
        if (!workDirSelect) return;
        workDirSelect.innerHTML = "";
        
        const paths = await getAllPaths();
        const activeId = await getActivePathId();

        if (paths.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "（无默认路径）";
            workDirSelect.appendChild(opt);
            workDirSelect.disabled = true;
            return;
        }

        workDirSelect.disabled = false;
        let foundActive = false;
        
        paths.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.id;
            opt.textContent = p.name;
            if (p.id === activeId) {
                opt.selected = true;
                foundActive = true;
            }
            workDirSelect.appendChild(opt);
        });

        // 如果当前选中的 ID 不在列表中（例如刚被删除），但列表不为空，默认选中第一个
        if (!foundActive && paths.length > 0) {
            workDirSelect.value = paths[0].id;
            switchActivePath(paths[0].id);
        }
    }

    if (workDirSelect) {
        workDirSelect.addEventListener("change", () => {
            const id = workDirSelect.value;
            if (id) switchActivePath(id);
        });
    }

    if (addWorkDirBtn) {
        addWorkDirBtn.addEventListener("click", async () => {
            if (!window.showDirectoryPicker) {
                statusEl.textContent = "当前浏览器不支持目录选择 API，无法添加路径。";
                return;
            }
            try {
                const handle = await window.showDirectoryPicker({
                    mode: "read"
                });
                if (handle) {
                    await addNewPath(handle);
                    await refreshWorkDirSelect();
                    statusEl.textContent = `已添加并选中新路径: ${handle.name}`;
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    console.error(e);
                    statusEl.textContent = "添加路径失败，请查看控制台。";
                }
            }
        });
    }

    if (removeWorkDirBtn) {
        removeWorkDirBtn.addEventListener("click", async () => {
            const activeId = await getActivePathId();
            if (!activeId) return;
            
            // 可以在这里加个 confirm，如果不加也行，毕竟还能再加回来
            await removeActivePath();
            await refreshWorkDirSelect();
            statusEl.textContent = "已移除当前选中的默认路径。";
        });
    }

    // 初始化时刷新一次下拉框
    refreshWorkDirSelect();


    if (undoBtn) {
        undoBtn.addEventListener("click", () => {
            if (!root) return;
            const prev = HistoryManager.undo(root.data);
            if (prev) {
                initTreeFromData(prev, currentJsonFileName);
                statusEl.textContent = "已撤销操作。";
            }
        });
    }

    if (redoBtn) {
        redoBtn.addEventListener("click", () => {
            if (!root) return;
            const next = HistoryManager.redo(root.data);
            if (next) {
                initTreeFromData(next, currentJsonFileName);
                statusEl.textContent = "已重做操作。";
            }
        });
    }

    // 初始化空画布
    initSvg();
    // 窗口大小改变时自动重绘
    window.addEventListener("resize", debounce(() => {
        if (root) {
            update(root);
        }
    }, 200));

    // 已去掉导出模板按钮，如需再次启用可在此处重新绑定事件
</script>
</body>
</html>
